<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KINETIC / MOBILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root{
  --bg:#0a0a0c; --panel:#141418; --line:#26262e;
  --text:#eceae4; --muted:#84838c; --amber:#ff9a1f; --cyan:#4fd8e8;
  --red:#ff4d4f; --green:#4ade80; --purple:#b98cff; --yellow:#eab308; --blue:#3b82f6;
  --sat-t:env(safe-area-inset-top,0px); --sat-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:#000; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px;}
/* App frame: fluid edge-to-edge on real phone widths, letterboxed to a phone-proportioned
   column on wider/desktop viewports so nothing stretches into giant, unreadable rows. */
#app{position:relative; max-width:480px; margin:0 auto; height:100%; max-height:100dvh; overflow:hidden; background:var(--bg); padding-top:var(--sat-t);}
@media (min-width:481px){ #app{box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6);} }
header{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);}
.brand{display:flex; align-items:baseline; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; min-width:0; overflow:hidden; white-space:nowrap;}
#sessionName{overflow:hidden; text-overflow:ellipsis;}
.brand span{color:var(--red);}
.status{display:flex; align-items:center; gap:9px; font-size:10px; color:var(--muted); flex-shrink:0; margin-left:8px;}
.status .src{display:flex; align-items:center;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:4px;}
.dot.live{background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.6s infinite;}
.dot.off{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.wxbar{display:none;}
.statusbar{background:var(--panel); border-bottom:1px solid var(--line); padding:9px 14px 10px;}
.sbrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;}
.sbrow:first-child{margin-top:0;}
.flagline{display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;}
.flagline .flag-icon{width:18px; height:18px; object-fit:contain;}
.laptxt{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; font-variant-numeric:tabular-nums; color:var(--text); flex-shrink:0;}
.wxline{display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;}
.wxline b{color:var(--text); font-weight:500;}
.wxline .unit{font-size:9px; margin-right:4px; color:var(--muted);}
.wxline b.sp{margin-left:2px;}
.clocktxt{font-variant-numeric:tabular-nums; font-size:13px; color:var(--amber); flex-shrink:0;}
.clocktxt.danger{color:var(--red);}
.sbrow.rc{font-size:10px; letter-spacing:.3px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; justify-content:flex-start;}
main{position:absolute; top:0; bottom:0; left:0; right:0; padding-top:112px; padding-bottom:calc(58px + var(--sat-b)); overflow:hidden;}
.view{display:none; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view.on{display:block;}
#timingList{padding:2px 0 8px;}
.trow{padding:10px 14px 9px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;}
.trow.selected{background:rgba(79,216,232,.08);}
.trow.pit{background:rgba(255,154,31,.07);}
.trow-top{display:flex; align-items:center; gap:7px;}
.pos{width:16px; font-weight:700; font-size:14px; color:var(--muted); flex-shrink:0; text-align:center;}
.swatch{width:3px; height:15px; border-radius:2px; flex-shrink:0;}
.avatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; flex-shrink:0; border:1px solid var(--line);}
.avatar[src=""], .avatar.hidden{visibility:hidden;}
.dname{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.3px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.teamlogo{height:11px; width:auto; max-width:34px; object-fit:contain; opacity:.85; flex-shrink:0;}
.drspill{font-size:8px; font-weight:700; padding:2px 5px; border-radius:3px; border:1px solid var(--line); color:var(--muted); flex-shrink:0; letter-spacing:.3px;}
.drspill.open{color:var(--green); border-color:var(--green);}
.pitbadge{font-size:8px; background:var(--amber); color:#111; padding:1px 4px; border-radius:2px; font-weight:700; flex-shrink:0;}
.retbadge{font-size:8px; background:var(--red); color:#111; padding:1px 4px; border-radius:2px; font-weight:700; flex-shrink:0;}
.gapcol{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:1px; flex-shrink:0;}
.gap{font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap;}
.gap.leader{color:var(--amber); letter-spacing:.6px; font-size:11px;}
.interval{font-size:9px; color:var(--muted); white-space:nowrap;}
.trow-mid{display:flex; align-items:center; gap:8px; margin-top:7px; margin-left:26px;}
.msecs{display:flex; gap:8px; flex:1; min-width:0;}
.ms{display:flex; flex-direction:column; gap:3px; min-width:0;}
.sbars{display:flex; gap:1.5px; height:9px;}
.sw{display:block; height:3px; border-radius:1px; background:#2c2c34;}
.sw.g{background:var(--green);} .sw.y{background:var(--amber);} .sw.p{background:var(--purple);}
.ms .st{font-size:10.5px; color:#5d5c66; font-variant-numeric:tabular-nums; white-space:nowrap; height:9px; line-height:9px;}
.ms.g .st{color:var(--green);} .ms.y .st{color:var(--amber);} .ms.p .st{color:var(--purple);}
.seg{flex:1; border-radius:1px; background:#2c2c34;}
.seg.g{background:var(--green);} .seg.y{background:var(--amber);} .seg.p{background:var(--purple);} .seg.b{background:var(--blue);} .seg.pit{background:var(--cyan);}
.tyre-wrap{position:relative; flex-shrink:0; width:22px; height:22px;}
.tyre{width:22px; height:22px; border-radius:50%; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}
.tyre.S{color:var(--red);} .tyre.M{color:var(--amber);} .tyre.H{color:#e8e8e8;} .tyre.I{color:var(--green);} .tyre.W{color:var(--cyan);}
.tyre-age{position:absolute; top:-5px; right:-7px; font-size:8px; color:var(--muted); background:var(--panel); padding:0 2px; border-radius:3px; line-height:1.3;}
.trow-sectors{display:flex; gap:16px; margin-top:5px; margin-left:26px; font-size:10.5px; color:var(--muted);}
.trow-sectors span.g{color:var(--green);} .trow-sectors span.p{color:var(--purple);}
.trow-bottom{display:flex; justify-content:space-between; margin-top:4px; margin-left:26px; font-size:10px; color:var(--muted);}
.trow-bottom b{color:var(--text); font-weight:500;}
.trow-bottom b.fast{color:var(--purple);} .trow-bottom b.pb{color:var(--green);}
.telem{display:flex; gap:9px; margin-top:6px; margin-left:26px; padding-top:6px; border-top:1px dashed var(--line); font-size:9.5px; color:var(--muted); flex-wrap:wrap; row-gap:4px;}
.telem b{color:var(--text); font-weight:600; font-size:11px;}
.telem .drs{padding:1px 6px; border-radius:3px; border:1px solid var(--line);}
.telem .drs.open{color:var(--green); border-color:var(--green);}
.telem .drs.aero.open{color:var(--cyan); border-color:var(--cyan);}
.telem .drs.ot.open{color:var(--purple); border-color:var(--purple); box-shadow:0 0 6px var(--purple);}
.bar{width:34px; height:4px; background:#3a3a42; border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:3px;}
.bar i{display:block; height:100%; background:var(--cyan);}
.bar.brk i{background:var(--red);}
.empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:12px;}
#trackView{position:relative; height:100%;}
#trackCanvas{width:100%; height:100%; display:block; touch-action:none;}
.track-hint{position:absolute; bottom:12px; left:12px; font-size:10px; color:var(--muted); background:rgba(20,20,24,.8); padding:5px 9px; border-radius:6px;}
.tvctl{position:absolute; top:10px; z-index:5; display:flex; flex-direction:column; gap:8px;}
.tvctl.l{left:10px;} .tvctl.r{right:10px;}
.tvb{width:38px; height:38px; border-radius:10px; background:rgba(20,20,24,.88); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; padding:0; cursor:pointer; touch-action:none;}
.tvb svg{width:17px; height:17px;}
#tvCompass{border-radius:50%;} #tvCompass b{position:absolute; top:2px; font-size:8px; color:var(--muted);}
#tvNeedle{width:3px; height:14px; background:linear-gradient(#ef4444 50%,#52525b 50%); border-radius:2px;}
.tvhid{display:none!important;}
#radioList{padding:8px;}
.filterbar{padding:10px 12px 4px;}
.filterbar select{width:100%; appearance:none; -webkit-appearance:none; background:#eceae4 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23141418" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center/14px; background-color:#eceae4; color:#141418; border:none; border-radius:20px; padding:10px 34px 10px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;}
.rcard{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:8px; padding:10px 12px; margin-bottom:6px;}
.rcard .rmeta{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11px;}
.rcard .ravatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; border:1px solid var(--line);}
.rcard .rtla{font-weight:700; font-size:12px;}
.rcard .rtime{color:var(--muted); margin-left:auto;}
.player{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
.playbtn{
  width:30px; height:30px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  background:var(--amber); color:#12100c; display:flex; align-items:center; justify-content:center;
  font-size:0; position:relative; transition:transform .1s, background .15s;
}
.playbtn:active{transform:scale(.92);}
.playbtn::before{content:''; width:0; height:0; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #12100c; margin-left:2px;}
.playbtn.playing::before{width:9px; height:11px; border-style:none; border-width:0; background:#12100c; box-shadow:4px 0 0 #12100c; margin-left:0; border-radius:1px;}
.playbtn.error{background:var(--red);}
.ptrack{flex:1; height:4px; background:#2a2a32; border-radius:2px; position:relative; cursor:pointer;}
.pfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--amber); border-radius:2px;}
.ptime{font-size:10px; color:var(--muted); flex-shrink:0; width:34px; text-align:right;}
.rcard .line{font-size:12px; margin-top:3px;}
.rcard .line b{color:var(--amber); margin-right:6px;}
#rcList{padding:8px;}
.rc-msg{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.flagchip{width:20px; height:20px; object-fit:contain; flex-shrink:0; margin-top:1px;}
.rc-msg .t{color:var(--muted); font-size:10px; display:block; margin-bottom:2px;}
nav{position:absolute; left:0; right:0; bottom:0; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--sat-b);}
nav button{flex:1; background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:500; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px;}
nav button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;}
nav button.on{color:var(--red);}
.tdetail{margin:7px 0 0 26px; padding-top:7px; border-top:1px dashed var(--line); font-size:11px; line-height:1.4;}
.tdetail .dgrid{display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); margin-bottom:4px;}
.tdetail .dgrid b{color:var(--text); font-weight:500;}
.tdetail .inc{padding:2px 0;} .tdetail .inc .t{color:var(--muted); margin-right:6px;}
.tbar{position:sticky; top:0; z-index:3; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 14px; border-bottom:1px solid var(--line); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.seg2{display:inline-flex; flex-shrink:0;}
.seg2 button{font:inherit; font-size:10px; letter-spacing:.4px; background:none; color:var(--muted); border:1px solid var(--line); padding:4px 11px; cursor:pointer;}
.seg2 button:first-child{border-radius:6px 0 0 6px;} .seg2 button:last-child{border-radius:0 6px 6px 0; border-left:none;}
.seg2 button.on{color:var(--text); background:var(--panel);}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">KINETIC<span>/</span><span id="sessionName" style="color:var(--muted); font-size:11px; font-weight:400;">—</span></div>
  <div class="status">
    <span class="src"><span class="dot off" id="dotTiming"></span>TIMING</span>
    <span class="src"><span class="dot off" id="dotMain"></span>LIVE</span>
    <span class="src"><span class="dot off" id="dotRadio"></span>RADIO</span>
  </div>
</header>
<div class="statusbar">
  <div class="sbrow">
    <span class="flagline"><span id="flagIcon">🏁</span><b id="statusText">Live</b></span>
    <b class="laptxt">Lap <span id="wLap">—</span></b>
  </div>
  <div class="sbrow">
    <span class="wxline"><span id="wxIcon">☀️</span><b id="wAir">—°</b><span class="unit">air</span><b id="wTrack">—°</b><span class="unit">trk</span><span id="wCond">—</span><b id="wHum" class="sp">—</b><b id="wWind" class="sp">—</b></span>
    <b class="clocktxt" id="wClock">—</b>
  </div>
  <div class="sbrow rc" id="rcTicker">—</div>
</div>
<main>
  <div class="view on" id="view-timing">
    <div class="tbar"><span id="secLabel">Mini sectors</span><span class="seg2" id="secToggle"><button data-m="mini">Mini</button><button data-m="times">Times</button></span></div>
    <div id="timingList"><div class="empty">Connecting to pitwall feed…</div></div></div>
  <div class="view" id="view-track"><div id="trackView"><canvas id="trackCanvas"></canvas>
    <div class="tvctl l">
      <button class="tvb" id="tvCompass" title="Drag to rotate, tap to reset"><b>N</b><div id="tvNeedle"></div></button>
      <button class="tvb" id="tvReset" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div class="tvctl r">
      <button class="tvb" id="tvRecenter" title="Recenter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
      <button class="tvb" id="tvZin" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></button>
      <button class="tvb" id="tvZout" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg></button>
    </div><div class="track-hint" id="trackHint">Connecting…</div></div></div>
  <div class="view" id="view-radio">
    <div class="filterbar"><select id="radioFilter"><option value="">Filter by drivers</option></select></div>
    <div id="radioList"><div class="empty">No transcripts yet.</div></div>
  </div>
  <div class="view" id="view-rc">
    <div class="tbar"><span>Race control</span><span class="seg2"><button id="rcBtnKey" class="on">Key</button><button id="rcBtnAll">All</button></span></div>
    <div id="rcList"><div class="empty">No messages yet.</div></div></div>
</main>
<nav>
  <button class="on" data-view="timing"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Timing</button>
  <button data-view="track"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Track</button>
  <button data-view="radio"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-7v14l-3-7H4z"/></svg>Radio</button>
  <button data-view="rc"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.9L20 9l-4.6 3.8L16.9 19 12 15.6 7.1 19l1.5-6.2L4 9l5.6-1.1z"/></svg>RC</button>
</nav>
</div>

<script>
/* ============================================================
   MAIN SOURCE — timing / weather / RC / track / telemetry
   pitwall.me feed, ported from track.html
   ============================================================ */
const MAIN_WS = "wss://api.pitwall.me/ws";
let state = {}, dirty = true, wsMain = null, backoffMain = 2000;
let circuitKey = null, telemetry = {};
let lastMainTiming = 0, lastMainCar = 0;   // when pitwall last delivered timing / car telemetry (drives the f1pedia fallback)
const mainStale = t => performance.now() - t > 8000;
let selectedDriver = null; // car number (string), selected from the Timing list or tapped on the Track map

// 2026 grid team logos (with number logos) + driver portraits, keyed by TLA.
const DRIVER_ASSETS = {
  NOR:{teamLogo:"https://images.prismic.io/formula-1-dashboard/Z7ZYlJ7c43Q3f_Pd_mclaren-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mclaren/lannor01/2026mclarenlannor01numberwhitefrless.webp"},
  PIA:{teamLogo:"https://images.prismic.io/formula-1-dashboard/Z7ZYlJ7c43Q3f_Pd_mclaren-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mclaren/oscpia01/2026mclarenoscpia01numberwhitefrless.webp"},
  RUS:{teamLogo:"https://images.prismic.io/formula-1-dashboard/Z7ZYkZ7c43Q3f_Pa_mercedes-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mercedes/georus01/2026mercedesgeorus01numberwhitefrless.webp"},
  ANT:{teamLogo:"https://images.prismic.io/formula-1-dashboard/Z7ZYkZ7c43Q3f_Pa_mercedes-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mercedes/andant01/2026mercedesandant01numberwhitefrless.webp"},
  VER:{teamLogo:"https://images.prismic.io/formula-1-dashboard/aS9MoHNYClf9nuMb_rbr-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/redbullracing/maxver01/2026redbullracingmaxver01numberwhitefrless.webp"},
  HAD:{teamLogo:"https://images.prismic.io/formula-1-dashboard/aS9MoHNYClf9nuMb_rbr-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/redbullracing/isahad01/2026redbullracingisahad01numberwhitefrless.webp"},
  LEC:{teamLogo:"https://images.prismic.io/formula-1-dashboard/Z7ZYjp7c43Q3f_PX_ferrari-normalized-logo.png", numberLogo:"https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/ferrari/chalec01/2026ferrarichalec01numberwhitefrless.webp"},

  if (parts.length===3) ms = (parts[0]*3600 + parts[1]*60 + parts[2]) * 1000;

const RADIO_WS = "wss://f1.f1pedia.com/api/v1/live/ws";
let radioSnap = null, wsRadio = null, backoffRadio = 2000, radioDirty = true;

// f1pedia frames may be plain JSON text or zlib/gzip/raw-deflate binary
function decodeFrame(d){
  if (typeof d === 'string') return d;
  const u = new Uint8Array(d), t = new TextDecoder().decode(u);
  if (t.trimStart()[0] === '{') return t;
  for (const f of [pako.inflate, pako.ungzip, pako.inflateRaw]){ try{ return new TextDecoder().decode(f(u)); }catch(err){} }
  throw new Error('undecodable frame');
}
/* ---- f1pedia fallback: car telemetry when pitwall CarData is silent ---- */
function applyFpTelemetry(s){
  if (!mainStale(lastMainCar)) return;            // pitwall CarData is flowing -> keep it
  const cd = s.car_data_by_driver; if (!cd) return;
  for (const num in cd){
    const c = cd[num] || {};
    telemetry[num] = {
      rpm: c.rpm, speed: c.speed, gear: c.gear,
      throttle: (c.throttle >= 0 && c.throttle <= 100) ? c.throttle : 0,
      brake: c.brake > 0 ? 100 : 0,
      drs: c.drs
    };
  }
  dirty = true;
}

function connectRadio(){
  setDot('dotRadio','connecting');
  try{ wsRadio = new WebSocket(RADIO_WS); }catch(e){ scheduleRadio(); return; }
  wsRadio.binaryType = 'arraybuffer';
  wsRadio.onopen = () => { setDot('dotRadio','live'); backoffRadio = 2000; };
  wsRadio.onmessage = (e) => {
    let m;
    try{ m = JSON.parse(decodeFrame(e.data)); }catch(err){ return; }
    if (m && m.snapshot){ radioSnap = m.snapshot; radioDirty = true; TM.pushFp(m.snapshot); applyFpTelemetry(m.snapshot); }
  };
  wsRadio.onclose = () => { setDot('dotRadio','off'); wsRadio = null; scheduleRadio(); };
  wsRadio.onerror = () => {};
}
function scheduleRadio(){ setTimeout(connectRadio, backoffRadio); backoffRadio = Math.min(backoffRadio*1.6, 20000); }

      path(0,n-1,1);ctx.strokeStyle='#8f97a3';ctx.lineWidth=9*q;ctx.stroke();
      const st=ST[tStatus],pulse=.35+.35*Math.abs(Math.sin(now/260));
      const over=(a,b,cl)=>{path(a,b,cl);ctx.strokeStyle=st.c;ctx.lineWidth=9*q;ctx.stroke();ctx.save();ctx.globalAlpha=pulse;ctx.lineWidth=15*q;ctx.stroke();ctx.restore()};
      if(st&&st.r){
        if(!st.sec)over(0,n-1,1);
        else{const y=yellows();T.sec.forEach((a,i)=>{if(!y.has(i+1))return;let b=T.sec[i+1]!==undefined?T.sec[i+1]:T.sec[0];if(b<a)b+=n;over(a,b,0)})}
      }
      path(0,n-1,1);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=Math.max(1,1.2*q);ctx.setLineDash([6*q,8*q]);ctx.stroke();ctx.setLineDash([]);
      if(n>3){const a=[SX[0],SY[0]],b=[SX[3],SY[3]];ctx.save();ctx.translate(a[0],a[1]);ctx.rotate(Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2);
        const w=22*q;for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#111318':'#fff';ctx.fillRect(-w/2+i*w/6,-5,w/6,10)}ctx.restore()}
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(231,234,238,.55)';ctx.font=`700 ${10*q}px monospace`;
      T.thirds.forEach((ix,i)=>ctx.fillText('SECTOR '+(i+1),SX[ix],SY[ix]-16*q));
      ctx.font=`700 ${9*q}px monospace`;
      for(const cn of T.corners){const p=pr(cn.x,cn.y);ctx.beginPath();ctx.arc(p[0],p[1],8*q,0,6.283);ctx.fillStyle='#1c1c28';ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#c4c8d0';ctx.fillText(cn.n,p[0],p[1]+.5)}
    }
    /* cars: interpolated on the active source's stream clock */
    const rt=Math.max(src.rtPrev,now+(src.off||0)-BUF_MS);src.rtPrev=rt;
    const qc=Math.min(q,1.6),R=11*qc;
    for(const k2 in scr)delete scr[k2];
    for(const num in src.cars){
      const d=info(num);if(d.out)continue;
      const pos=at(src.cars[num],rt);if(!pos)continue;
      const p=pr(pos.x,pos.y);scr[num]=p;
      if(selectedDriver===num){const pl=1+.18*Math.sin(now/220);ctx.strokeStyle='#4fd8e8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],(R+6)*pl,0,6.283);ctx.stroke()}
      ctx.beginPath();ctx.arc(p[0],p[1],R,0,6.283);ctx.fillStyle=d.pit?'#6b7280':d.color;ctx.fill();
      if(selectedDriver===num){ctx.strokeStyle='#0a0a0c';ctx.lineWidth=2;ctx.stroke()}
      ctx.fillStyle='#0a0a0c';ctx.font=`bold ${8.5*qc}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.tla.slice(0,3),p[0],p[1]+.5);
      const bx=p[0]+R*.78,by=p[1]-R*.78,br=6.5*qc;
      ctx.fillStyle='#0a0a0c';ctx.beginPath();ctx.arc(bx,by,br,0,6.283);ctx.fill();ctx.strokeStyle=d.color;ctx.lineWidth=1.3;ctx.stroke();
      ctx.fillStyle='#eceae4';ctx.font=`bold ${7*qc}px monospace`;ctx.fillText(String(d.no),bx,by+.5);
    }
    $('tvNeedle').style.transform=`rotate(${-(V.r-T.base)}deg)`;
  }
  return{pushMain,pushFp,ensureCircuit,draw,resize};
})();

/* ============================================================
   RENDER LOOP — throttled full rebuilds (kills the flicker),
   track canvas still redraws every frame for smooth playback
   ============================================================ */
let lastFullRender = 0;
function render(now){
  if (dirty && now - lastFullRender > 500){
    dirty = false; lastFullRender = now;
    renderStatusBar(); renderTiming(); renderRC(); renderLap();
  }
  renderClock();
  if (radioDirty && now - lastFullRender > 500){ radioDirty = false; renderRadio(); }
  if (document.getElementById('view-track').classList.contains('on')) TM.draw(now);
  requestAnimationFrame(render);
}

document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    btn.classList.add('on'); document.getElementById('view-'+btn.dataset.view).classList.add('on');
    if (btn.dataset.view==='track') TM.resize();
  });
});

TM.resize();
connectMain();
connectRadio();
bootstrapK().then(connectK);
loop(pollTiming, 2000, 20000);
loop(pollMeta, 5000, 30000);
requestAnimationFrame(render);
</script>
