}
function insDrivers(){ return buildRows().filter(r => r.pos < 999).sort((a,b) => a.pos - b.pos); }
function renderStrategy(){
  const rows = insDrivers(); if (!rows.length) return '<div class="empty">Waiting for stint data…</div>';
  const all = rows.map(r => [r, stintsFor(r)]);
  const lc = (ks.lap && ks.lap.TotalLaps) ? ks.lap : (state.LapCount || {});
  const total = +lc.TotalLaps || Math.max(10, ...all.map(([, s]) => s.reduce((a, x) => a + x.laps, 0)));
  return all.map(([r, st]) => `<div class="strow" data-num="${esc(r.num)}"><span class="stpos">${r.pos}</span><span class="stsw" style="background:${esc(r.color)}"></span><span class="sttla">${esc(r.tla)}</span><div class="stline">${
    st.map(s => `<div class="stseg" style="width:${Math.max(4, s.laps / total * 100)}%"><i class="stbar" style="background:${TY_COL[s.c] || '#888'}"></i><span class="stpill"><img class="sti" src="${tyImg(s.c)}" alt="${s.c}"><b>${s.laps}</b></span></div>`).join('') || '<i style="flex:1;height:2px;background:#2c2c34"></i>'}</div></div>`).join('');
}
function spdV(v){ return v && typeof v === 'object' ? (v.Value ?? v.value ?? '') : (v ?? ''); }
function renderSpeedTrap(){
  const stats = (state.TimingStats && state.TimingStats.Lines) || (ks.TimingStats && ks.TimingStats.Lines) || {};
  const lines = (state.TimingData && state.TimingData.Lines) || (ks.TimingData && ks.TimingData.Lines) || {};
  const rows = insDrivers(), byNum = new Map(rows.map(r => [String(r.num), r]));
  const out = [];
  for (const num of new Set([...Object.keys(stats), ...Object.keys(lines)])){
    if (num === '_kf') continue;
    const sp = (stats[num] && stats[num].BestSpeeds) || (lines[num] && lines[num].Speeds); if (!sp) continue;
    const v = {}; let any = false; for (const k of ['I1','I2','FL','ST']){ v[k] = String(spdV(sp[k]) || ''); if (v[k]) any = true; }
    if (any) out.push({num, r: byNum.get(num), v, ov: {I1:sp.I1 && sp.I1.OverallFastest, I2:sp.I2 && sp.I2.OverallFastest, FL:sp.FL && sp.FL.OverallFastest, ST:sp.ST && sp.ST.OverallFastest}});
  }
  if (!out.length) return '<div class="empty">Waiting for speed trap data…</div>';
  out.sort((a, b) => (parseFloat(b.v.ST) || 0) - (parseFloat(a.v.ST) || 0));
  const mx = {}; for (const k of ['I1','I2','FL','ST']) mx[k] = Math.max(...out.map(o => parseFloat(o.v[k]) || 0));
  const cell = (o, k) => `<td class="${(o.ov[k] || (parseFloat(o.v[k]) || -1) === mx[k]) ? 'top' : ''}">${esc(o.v[k] || '—')}</td>`;
  return `<table class="spt"><thead><tr><th>#</th><th>Driver</th><th>I1</th><th>I2</th><th>FL</th><th>ST</th></tr></thead><tbody>${out.map((o, i) => { const tla = o.r ? o.r.tla : ((state.DriverList || {})[o.num] || {}).Tla || o.num;
    return `<tr data-num="${esc(o.num)}"><td>${i + 1}</td><td><div class="sdrv"><img src="${portraitUrl(String(tla))}" alt="" onerror="this.classList.add('hidden')"><span style="color:${o.r ? esc(o.r.color) : 'inherit'}">${esc(tla)}</span></div></td>${cell(o,'I1')}${cell(o,'I2')}${cell(o,'FL')}<td><b>${cell(o,'ST').replace(/^<td/, '<span').replace(/<\/td>$/, '</span>')}</b></td></tr>`; }).join('')}</tbody></table>`;
}
function sessText(){
  const se = ks.sess || {}, info = se.info || (ks.SessionInfo && ks.SessionInfo.info) || ks.SessionInfo || {};
  const si = (info.Meeting || info.Name) ? info : (state.SessionInfo || {});
  return ((si.Type || '') + ' ' + (si.Name || '')).toLowerCase();
}
const FL_SEG = [2048, 2049, 2051, 2052];
function flSegs(r, i){ const s = toList(r.sectors)[i]; let g = toList(s && (s.Segments || s.segments)); if (!g.length && r.segs && r.segs[i]) g = r.segs[i]; return g.map(x => Number((x && typeof x === 'object') ? (x.Status ?? x.status) : x)); }
function flCls(st){ return st === 2048 ? 's' : st === 2049 ? 'g' : (st === 2051 || st === 2052) ? 'p' : st === 2064 ? 'b' : ''; }
function flFmt(ms){ if (!ms || ms < 0) return '-:--.---'; const t = ms / 1000; return Math.floor(t / 60) + ':' + (t % 60).toFixed(3).padStart(6, '0'); }
function renderFlying(){
  const s = sessText(), quali = /quali|shootout/.test(s), prac = /practice/.test(s);
  const rows = insDrivers().map(r => ({r, n: [0,1,2].reduce((a, i) => a + flSegs(r, i).filter(x => FL_SEG.includes(x)).length, 0)}));
  const sel = document.getElementById('flSel'), opts = '<option value="">Auto</option>' + rows.map(x => `<option value="${esc(x.r.num)}">${esc(x.r.tla)} (${esc(x.r.num)})</option>`).join('');
  if (sel.dataset.o !== opts){ sel.innerHTML = opts; sel.dataset.o = opts; }
  sel.value = INS.auto ? '' : (INS.num || ''); document.getElementById('flAuto').checked = INS.auto;
  if (!quali && !prac) return '<div class="empty">Flying Lap is available during Practice and Qualifying.</div>';
  const act = x => !x.r.pit && !x.r.ret && x.n > 0;
  const cur = INS.auto ? rows.filter(act).sort((a, b) => b.n - a.n)[0] : rows.find(x => String(x.r.num) === String(INS.num));
  if (!cur) return '<div class="empty">Waiting for a driver on a flying lap…</div>';
  const r = cur.r; INS.num = r.num;
  const key = `${r.num}:${r.laps}:${r.last}`; if (INS.key !== key){ INS.key = key; INS.t0 = performance.now(); }
  const tg = quali ? (rows.find(x => x.r.pos === 1) || rows[0]) : rows.reduce((b, x) => (lapSecs(x.r.best) < lapSecs(b.r.best) ? x : b), rows[0]);
  const c = String(r.comp || '?')[0].toUpperCase(), tl = teamLogoUrl(String(r.tla));
  const secs = [0,1,2].map(i => { const sc = toList(r.sectors)[i]; const t = sc && typeof sc === 'object' ? (sc.time ?? sc.Value ?? '') : '';
    return `<div class="flsec"><div class="flsd"><span>S${i+1}</span><span>${esc(t) || '-'}</span></div><div class="flms">${flSegs(r, i).map(x => `<i class="${flCls(x)}"></i>`).join('') || '<i></i>'}</div></div>`; }).join('');
  return `<div class="flw"><div class="flh" style="border-color:${esc(r.color)}"><span class="flpos">${r.pos}</span><img class="fa" src="${portraitUrl(String(r.tla))}" alt="" onerror="this.classList.add('hidden')">${tl ? `<img class="fl" src="${tl}" alt="">` : ''}<span class="flt">${esc(r.tla)}<small>#${esc(r.num)}</small></span><img class="fy" src="${tyImg(c)}" alt="${c}"></div>
    <div class="flrow"><div class="fltime" id="flTime">${flFmt(performance.now() - INS.t0)}</div>${tg ? `<div class="fltg" style="border-bottom:2px solid ${esc(tg.r.color)}">${esc(tg.r.tla)} #${esc(tg.r.num)}<b>${esc(tg.r.best || '-')}</b></div>` : ''}</div><div class="flsecs">${secs}</div></div>`;
}
function renderInsights(){
  document.getElementById('flCtl').style.display = INS.tab === 'fly' ? 'flex' : 'none';
  document.querySelectorAll('#insTabs button').forEach(b => b.className = b.dataset.t === INS.tab ? 'on' : '');
  const h = INS.tab === 'speed' ? renderSpeedTrap() : INS.tab === 'fly' ? renderFlying() : renderStrategy();
  morph(document.getElementById('insBody'), h);
}
document.querySelectorAll('#insTabs button').forEach(b => b.onclick = () => { INS.tab = b.dataset.t; renderInsights(); });
document.getElementById('flSel').onchange = e => { INS.num = e.target.value || null; INS.auto = !e.target.value; renderInsights(); };
document.getElementById('flAuto').onchange = e => { INS.auto = e.target.checked; renderInsights(); };
document.getElementById('insBody').addEventListener('click', e => { const t = e.target.closest('[data-num]'); if (t && INS.tab !== 'fly'){ const n = t.dataset.num; selectedDriver = selectedDriver === n ? null : n; renderTiming(); } });
setInterval(() => { const el = document.getElementById('flTime'); if (el && INS.t0) el.textContent = flFmt(performance.now() - INS.t0); }, 100);

/* ============================================================
   OVERTAKE (OT) ESTIMATOR — no DRS channel exists in 2026.
   Uses only speed / throttle / brake / gear / RPM (2 Hz) + the gap to the car ahead.
   1. Baseline: per driver, per (aero-state, 10 km/h bin) acceleration on full-throttle samples while
      "alone" (gap ahead > 2 s). Tracks the lower envelope, i.e. the no-Boost/no-Overtake reference.
   2. dP ≈ m · (a − a_base) · v   (same speed bin + aero state, so the drag term cancels).
   3. Compare with the MGU-K envelope: standard 350 kW to 290 km/h then fading to 355; Overtake holds 350 kW to 337.
   4. Classify:  dP≥150 kW (or ≥60% of the envelope gain) with car ahead ≤1 s → OVERTAKE
                 dP≥150 kW short spike → BOOST · dP≥150 sustained → COMBINED · 50–100 kW sustained → STRAIGHT
   If the feed's own Manual-Override channel (47) is present it wins.
   ============================================================ */
const OTM = (() => {
  const MASS = 798, HOLD = 2000, H = {};
  const pStd = v => v <= 290 ? 350 : v < 355 ? 350 * (355 - v) / 65 : 0;
  const pOm  = v => v <= 337 ? 350 : v < 355 ? 350 * (355 - v) / 18 : 0;
  function feed(num, t, gapAhead){
    if (!t || typeof t.speed !== 'number') return {mode:'—', ot:false, dP:0};
    const h = H[num] || (H[num] = {obj:null, s:[], base:{}, dps:[], hold:null});
    const now = performance.now();
    if (h.obj !== t){                       // a new telemetry frame arrived
      h.obj = t;
      const s = h.s, prev = s[s.length - 1];
      const cur = {t:now, v:t.speed, thr:t.throttle || 0, brk:t.brake ? 1 : 0, gear:t.gear, aero:t.aero};
      s.push(cur); if (s.length > 14) s.shift();
      if (prev){
        const dt = (cur.t - prev.t) / 1000;
        const clean = dt > 0.2 && dt < 1.5 && cur.thr >= 98 && prev.thr >= 98 && !cur.brk && !prev.brk && cur.gear === prev.gear && cur.v > 120;
        if (clean){
          const a = ((cur.v - prev.v) / 3.6) / dt;                 // m/s²
          const key = (cur.aero ?? 'x') + ':' + Math.round(cur.v / 10);
          const b = h.base[key];
          const alone = !(gapAhead <= 2) && t.overtake !== 1;
          if (!b) { if (alone) h.base[key] = {a, n:1}; }
          else if (alone){ b.a = a < b.a ? 0.7 * b.a + 0.3 * a : 0.97 * b.a + 0.03 * a; b.n++; }
          const bb = h.base[key];
          const dP = bb && bb.n >= 3 ? MASS * (a - bb.a) * (cur.v / 3.6) / 1000 : 0;   // kW
          h.dps.push({t:now, dP, v:cur.v, a}); if (h.dps.length > 12) h.dps.shift();
        } else if (cur.brk || cur.thr < 90){ h.dps.length = 0; }
      }
    }
    const last3 = h.dps.slice(-3);
    const dP = last3.length ? last3.reduce((x, y) => x + y.dP, 0) / last3.length : 0;
    let dur = 0, j = h.dps.length - 1;
    while (j >= 0 && h.dps[j].dP > 50) j--;
    if (j < h.dps.length - 1) dur = (h.dps[h.dps.length - 1].t - h.dps[j + 1].t) / 1000 + 0.5;
    const v = t.speed, env = pOm(v) - pStd(v);
    const near = gapAhead <= 1;
    let mode = null;
    if (t.overtake === 1) mode = 'OVERTAKE';
    else if (dP >= 150 || (env > 40 && dP >= 0.6 * env && v > 295)){
      mode = near ? 'OVERTAKE' : (dur > 3 ? 'COMBINED' : 'BOOST');
    } else if (dP >= 50 && dur >= 2) mode = 'STRAIGHT';
    else if (t.aero === 1) mode = 'STRAIGHT';
    if (mode){ h.hold = {mode, until: now + HOLD}; }
    else if (h.hold && h.hold.until > now) mode = h.hold.mode;
    else h.hold = null;
    return {mode: mode || '—', ot: mode === 'OVERTAKE' || (mode === 'COMBINED' && near), dP};
  }
  return {feed};
})();

/* ---- Track-map telemetry HUD (replaces the per-row telemetry in the timing list) ---- */
const hudTrend = {}, hudSpd = {};   // num -> {v, up}
function numGap(x){ const n = parseFloat(String(x ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? NaN : n; }
function updateHud(){
  const el = document.getElementById('tvHud');
  if (!el || !document.getElementById('view-track').offsetParent) return;   // track view hidden (mobile other tab)
  const rows = buildRows().filter(r => r.pos < 999).sort((a, b) => a.pos - b.pos);
  if (!rows.length){ el.style.display = 'none'; return; }
  const r = rows.find(x => String(x.num) === String(selectedDriver)) || rows[0];
  const nk = String(r.num), t = telemetry[nk] || {};
  const isLeader = r.pos === 1;
  const gapNum = isLeader ? NaN : numGap(r.interval);
  const ot = OTM.feed(nk, t, gapNum);
  const raceMode = isRaceSession();
  const gp = r.grid > 0 ? r.grid : gridMap[r.num];
  let delta = '<span class="hud-delta even" title="Positions vs start (races & sprints only)">–</span>';
  if (raceMode && gp > 0){
    const dl = gp - r.pos;
    delta = dl > 0 ? `<span class="hud-delta up" title="Started P${gp}">▲${dl}</span>` : dl < 0 ? `<span class="hud-delta down" title="Started P${gp}">▼${-dl}</span>` : `<span class="hud-delta even" title="Started P${gp}">=0</span>`;
  }
  const rpm = typeof t.rpm === 'number' ? t.rpm : 0, spd = typeof t.speed === 'number' ? t.speed : null;
  const gear = t.gear === 0 ? 'N' : (t.gear < 0 ? 'R' : (t.gear ?? '–'));
  const ARC = 84.8, frac = Math.max(0, Math.min(1, rpm / 15000));
  const fastest = Math.min(...rows.map(x => lapSecs(x.best)));
  const bestS = lapSecs(r.best), lastS = lapSecs(r.last);
  const bestCls = isFinite(fastest) && bestS === fastest ? 'p' : '';
  const lastCls = isFinite(fastest) && lastS === fastest ? 'p' : (isFinite(lastS) && lastS === bestS ? 'g' : '');
  // is the gap to the car ahead closing?
  const tr = hudTrend[nk] || (hudTrend[nk] = {v:gapNum, up:false});
  if (isFinite(gapNum) && isFinite(tr.v) && Math.abs(gapNum - tr.v) > 0.004){ tr.up = gapNum < tr.v; tr.v = gapNum; } else if (isFinite(gapNum) && !isFinite(tr.v)) tr.v = gapNum;
  const intTxt = isLeader ? '—' : fmtGap(r.interval, r.pos), ldrTxt = isLeader ? 'LEADER' : fmtGap(r.gap, r.pos);
  const secs = toList(r.sectors).slice(0, 3); while (secs.length < 3) secs.push(null);
  const secHtml = secs.map((s, i) => {
    const v = (s && typeof s === 'object') ? s : {};
    const cls = secClass(v), time = v.time ?? v.Value ?? '';
    let segs = toList(v.Segments || v.segments); if (!segs.length && r.segs && r.segs[i]) segs = r.segs[i];
    const bars = segs.map(sg => `<i class="seg ${segClass((sg && typeof sg === 'object') ? (sg.Status ?? sg.status) : sg)}"></i>`).join('');
    return `<span class="ms ${cls}" style="flex:${Math.max(segs.length, 3)}"><span class="sbars">${bars || '<i class="seg"></i>'}</span><span class="st">${esc(time) || '—'}</span></span>`;
  }).join('');
  const hudMode = ot.ot || ot.mode === 'OVERTAKE' ? {cls:'ot', txt:'OT', lbl:'Overtake'}
    : ot.mode === 'BOOST' || ot.mode === 'COMBINED' ? {cls:'bst', txt:'BST', lbl:ot.mode === 'COMBINED' ? 'Combined' : 'Boost'}
    : ot.mode === 'STRAIGHT' ? {cls:'sm', txt:'SM', lbl:'Straight'}
    : {cls:'', txt:'OT', lbl:''};
  const brkRaw = Number(t.brake) || 0;
  const brkPct = Math.max(0, Math.min(100, brkRaw));
  const braking = brkPct > 0;
  // deceleration (g) from consecutive speed frames: a pressure proxy when the feed's brake channel is only on/off
  const hs = hudSpd[nk] || (hudSpd[nk] = {obj:null, v:null, t:0, g:0});
  if (hs.obj !== t && typeof t.speed === 'number'){
    const nowT = performance.now(), dt = (nowT - hs.t) / 1000;
    if (hs.v !== null && dt > 0.2 && dt < 1.5) hs.g = Math.max(0, (hs.v - t.speed) / 3.6 / dt / 9.81);
    hs.obj = t; hs.v = t.speed; hs.t = nowT;
  }
  const decelG = braking ? hs.g : 0;
  const brkTip = braking ? 'Brake pressure ' + Math.round(brkPct) + '%' + (decelG > 0.2 ? ' · decel ' + decelG.toFixed(1) + ' g' : '') : 'Brake off';
  const modeTip = ot.mode === '—' ? 'No extra deployment detected' : ot.mode + ' · est. ΔP ' + Math.round(ot.dP) + ' kW';
  el.style.display = 'flex';
  el.innerHTML = `
    <div class="hud-grp"><span class="hud-pos"><b>${r.pos}</b><span style="background:${esc(r.color)}">${esc(String(r.tla))}</span></span>${delta}
      <span class="hud-ot ${hudMode.cls}" title="${esc(modeTip)}"><b>${hudMode.txt}</b><em>${hudMode.lbl}</em></span>
      <span class="hud-brk ${braking ? 'on' : ''}" title="${esc(brkTip)}"><b>BRK</b><span class="bbar"><i style="width:${brkPct}%"></i></span><em>${braking && decelG > 0.2 ? '−' + decelG.toFixed(1) + 'g' : (braking ? 'Braking' : '')}</em></span></div>
    <div class="hud-grp"><span class="hud-gauge"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18" stroke-dasharray="${ARC} 113.1"/><circle class="fg ${frac > .92 ? 'hot' : ''}" cx="22" cy="22" r="18" stroke-dasharray="${(ARC * frac).toFixed(1)} 113.1"/></svg><span class="gear">${gear}</span><span class="rpm">${rpm || '–'}</span></span>
      <span class="hud-spd ${spd !== null && spd < 30 ? 'slow' : ''}" data-act="speed" title="Click for speed trap speeds"><b>${spd ?? '–'}</b><small>km/h</small></span></div>
    <div class="hud-laps"><i>LAST</i><span class="pill ${lastCls}">${esc(r.last)}</span><i>BEST</i><span class="${bestCls}">${esc(r.best)}</span></div>
    <div class="hud-gaps"><i>INT</i><span class="pill ${tr.up && !isLeader ? 'g' : ''}">${esc(intTxt)}</span><i>LDR</i><span>${esc(ldrTxt)}</span></div>
    <div class="hud-secs">${secHtml}</div>
    <div class="hud-tyre" data-act="tyre" title="Click for tyre history">${tyreBadge(r.comp, r.age)}</div>`;
}
document.getElementById('tvHud').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  INS.tab = a.dataset.act === 'speed' ? 'speed' : 'tyres';
  renderInsights();
  const nb = document.querySelector('nav button[data-view="insights"]'); if (nb) nb.click();
});
setInterval(updateHud, 250);
let lastFullRender = 0;
function render(now){
  if (dirty && now - lastFullRender > 500){
    dirty = false; lastFullRender = now;
    renderStatusBar(); renderTiming(); renderRC(); renderLap(); renderBattles(); renderInsights();
  }
  renderClock();
  if (radioDirty && now - lastFullRender > 500){ radioDirty = false; renderRadio(); }
  if (DESK.matches || document.getElementById('view-track').classList.contains('on')) TM.draw(now);
  requestAnimationFrame(render);
}

document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    btn.classList.add('on'); document.getElementById('view-'+btn.dataset.view).classList.add('on');
    if (btn.dataset.view==='track') TM.resize();
  });
});

TM.resize();
setTimeout(() => TM.resize(), 0);
connectMain();
connectRadio();
bootstrapK().then(connectK);
loop(pollTiming, 2000, 20000);
loop(pollMeta, 5000, 30000);
requestAnimationFrame(render);
</script>
