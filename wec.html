<script>
const WORKER='https://wecdata.denuwanbogoda2010911.workers.dev';
const API=location.hostname.endsWith('workers.dev')?'':WORKER;
const CAT_COLOR={HYPERCAR:'#e10600',LMGT3:'#ff9f1c'};
let data=null,cat='ALL',query='',open={},lastOk=0,fails=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseT(s){if(s==null||s==='-'||s==='NaN')return NaN;const p=String(s).split(':').map(Number);if(p.some(isNaN))return NaN;let x=0;p.forEach(v=>x=x*60+v);return Math.round(x*1000)}
function fmtMs(ms){if(!ms||isNaN(ms)||ms<=0)return'-';const m=Math.floor(ms/60000),s=(ms%60000)/1000;return m?m+':'+s.toFixed(3).padStart(6,'0'):s.toFixed(3)}
function hms(s){s=Math.max(0,Math.floor(s));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function gapF(ms,l){if(l&&l!=='-')return'+'+l+'L';if(!ms||ms<=0)return'-';if(ms>=60000)return'+'+fmtMs(ms).slice(0,-1);return'+'+(ms/1000).toFixed(3)}
function flagInfo(p,fs){let st=String(p.raceState||'');const c=(fs||[]).find(f=>f.current);if(c&&c.state)st=c.state;const k=st.toLowerCase();
 if(k==='chk'||k.includes('check'))return{cls:'chk',txt:'CHEQUERED'};if(k.includes('red'))return{cls:'red',txt:'RED FLAG'};if(k.includes('vsc'))return{cls:'vsc',txt:'VSC'};
 if(k.includes('fcy')||k.includes('full'))return{cls:'fcy',txt:'FULL COURSE YELLOW'};if(k.includes('safety')||k==='sc')return{cls:'sc',txt:'SAFETY CAR'};
 if(k.includes('yellow'))return{cls:'yellow',txt:'YELLOW'};if(k.includes('green'))return{cls:'green',txt:'GREEN'};return{cls:'',txt:st.toUpperCase()||'—'}}
async function tick(){try{const r=await fetch(API+'/data?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();lastOk=Date.now();fails=0;render()}catch(e){fails++}setTimeout(tick,3000)}
setInterval(()=>{const el=$('st');if(!lastOk){el.className='status bad';el.textContent=fails?'no connection':'connecting…';return}const a=Math.round((Date.now()-lastOk)/1000);el.className='status '+(a>10?'bad':'ok');el.textContent=(a>10?'stale ':'live ')+a+'s'},1000);
function setHH(){document.documentElement.style.setProperty('--hh',(document.querySelector('header').offsetHeight+12)+'px')}
addEventListener('resize',setHH);
function header(){const p=data.params||{},f=flagInfo(p,data.progressFlagState);document.body.dataset.f=f.cls;flagWatch(f);
 $('sname').textContent=p.sessionName||'—';$('sevent').textContent=(p.eventName&&p.eventName!=='N/A')?p.eventName:'FIA World Endurance Championship';$('flagtxt').textContent=f.txt;
 const ended=f.cls==='chk'||(p.remaining!=null&&p.remaining<0);$('rem').textContent=ended?'FINISHED':hms(p.remaining);
 const d=p.duration||0,e=p.elapsedTime||0;$('prog').style.width=(d?Math.min(100,e/d*100):ended?100:0)+'%';
 const w=[];if(p.airTemp!=null)w.push('Air <b>'+p.airTemp+'°C</b>');if(p.trackTemp!=null)w.push('Track <b>'+p.trackTemp+'°C</b>');if(p.humidity!=null)w.push('Hum <b>'+p.humidity+'%</b>');
 if(p.pressure!=null)w.push('Press <b>'+p.pressure+' hPa</b>');if(p.windSpeed!=null)w.push('Wind <b>'+p.windSpeed+' km/h @ '+p.windDirection+'°</b>');
 $('wx').innerHTML=w.map(x=>'<span>'+x+'</span>').join('');setHH();updHud()}
function render(){if(!data)return;header();document.body.classList.toggle('compact',mode==='compact');const all=(data.entries||[]).filter(Boolean);
 const cats=['ALL',...new Set(all.map(e=>e.category).filter(Boolean))];if(!cats.includes(cat))cat='ALL';
 $('tabs').innerHTML=cats.map(c=>'<button class="tab '+(c===cat?'on':'')+'" data-c="'+esc(c)+'">'+(c!=='ALL'?'<i style="background:'+(CAT_COLOR[c]||'#888')+'"></i>':'')+esc(c)+'</button>').join(' ');

async function gJson(path, opts) {
  let lastErr;
  const order = G.okBase ? [G.okBase, ...G.bases.filter(b => b !== G.okBase)] : G.bases;
  for (const b of order) {
    try {
      const r = await fetch(b + path, opts);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      G.okBase = b; return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function listOf(v) {
  if (!v) return [];
  if (Array.isArray(v.items)) return v.items;
  if (v.pid != null) return [v];
  if (Array.isArray(v)) return v;
  return Object.values(v).filter(o => o && typeof o === 'object' && !Array.isArray(o));
}
const numOf = i => i.number ?? i.carNumber ?? i.startNumber ?? i.vehicleNumber ?? i.raceNumber ?? i.carNo;

function collectParts(o, allowId, depth = 0) {
  if (!o || typeof o !== 'object' || depth > 6) return;
  if (Array.isArray(o)) { o.forEach(x => collectParts(x, allowId, depth + 1)); return; }
  const pid = o.pid ?? (allowId ? o.id : undefined);
  const n = numOf(o);
  if (pid != null && n != null && (typeof n === 'string' || typeof n === 'number')) G.pidNum.set(String(pid), String(n));
  for (const v of Object.values(o)) if (v && typeof v === 'object') collectParts(v, allowId, depth + 1);
}

function normPoints(raw) {
  if (!Array.isArray(raw)) return null;
  const out = []; let geo = false;
  for (const p of raw) {
    let x, y;
    if (Array.isArray(p)) { x = +p[0]; y = +p[1]; }
    else if (p && typeof p === 'object') {
      if ('lat' in p && ('lon' in p || 'lng' in p)) { y = +p.lat; x = +(p.lon ?? p.lng); geo = true; }
      else if ('latitude' in p) { y = +p.latitude; x = +p.longitude; geo = true; }
      else { x = +(p.x ?? p.X); y = +(p.y ?? p.Y); }
    }
    if (isFinite(x) && isFinite(y)) out.push([x, y]);
  }
  return out.length > 10 ? { pts: out, geo } : null;
}

function buildMap() {
  const n = normPoints(G.raw);
  if (!n) { dbg('track points: unrecognised shape -> ' + JSON.stringify(G.raw).slice(0, 200)); return false; }
  G.geo = n.geo;
  const lon0 = n.geo ? n.pts[0][0] : 0, la0 = n.geo ? n.pts[0][1] : 0;
  const k = n.geo ? Math.cos(la0 * Math.PI / 180) : 1;
  const T = (x, y) => {
    let X = (x - lon0) * k, Y = -(y - la0);
    for (let i = 0; i < G.rot; i++) [X, Y] = [-Y, X];
    if (G.flip) X = -X;
    return [X, Y];
  };
  const P = n.pts.map(p => T(p[0], p[1]));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of P) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const PAD = 50, sc = (1000 - 2 * PAD) / Math.max(x1 - x0, y1 - y0, 1e-9);
  const ox = (1000 - (x1 - x0) * sc) / 2, oy = (1000 - (y1 - y0) * sc) / 2;
  const S = ([x, y]) => [ox + (x - x0) * sc, oy + (y - y0) * sc];
  G.xy = P.map(S);
  G.toScreen = (lon, lat) => S(T(lon, lat));
  G.d = 'M' + G.xy.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
  G.cum = [0]; let t = 0;
  for (let i = 1; i <= G.xy.length; i++) {
    const a = G.xy[i - 1], b = G.xy[i % G.xy.length];
    t += Math.hypot(b[0] - a[0], b[1] - a[1]); G.cum.push(t);
  }
  G.total = t;
  return true;
}

function posAt(rd) {
  if (!G.xy || !G.total || rd == null || !isFinite(rd)) return null;
  if (rd > 1.5) rd = rd / 100;
  rd = ((rd % 1) + 1) % 1;
  const target = rd * G.total;
  let lo = 0, hi = G.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (G.cum[m] <= target) lo = m; else hi = m; }
  const a = G.xy[lo], b = G.xy[(lo + 1) % G.xy.length];
  const seg = G.cum[lo + 1] - G.cum[lo] || 1, f = (target - G.cum[lo]) / seg;
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

}

        const pid = i.pid ?? i.vid ?? i.id; if (pid == null || i.isDeleted) continue;
        const r = i.rd ?? i.relativeDistance;
        if (r != null && r >= 0) setRd(pid, r, now);
      }
    } else if (ch === 'car-location-on-track') {
      for (const i of listOf(v)) {
        const pid = i.pid ?? i.vid ?? i.id; if (pid == null || i.isDeleted) continue;
        const c = G.cars.get(pid) || {}; if (i.carLocation) c.loc = i.carLocation; c.seen = now; G.cars.set(pid, c);
        const r = i.relativeDistance ?? i.rd; if (r != null && r >= 0) setRd(pid, r, now);
      }
    } else if (ch === 'participants') {
      collectParts(v, false);
    } else if (ch === 'race-log') {
      asList(v).forEach(rcFromLog);
    } else if (ch === 'race-flags') {
      asList(v).forEach(rcFromFlag);
    } else if (ch === 'commentator-phrase') {
      if (v && v.phrase) rcPush('comment', v.phrase, v.ts, 'c' + (v.ts || v.phrase.slice(0, 40)));
    }
  }
}

async function startHub(base) {
  const conn = new signalR.HubConnectionBuilder()
    .withUrl(base + '/live-session-stream', { withCredentials: false })
    .withHubProtocol(new signalR.protocols.msgpack.MessagePackHubProtocol())
    .withAutomaticReconnect([0, 2000, 5000, 10000, 20000])
    .configureLogging(signalR.LogLevel.Warning)
    .build();
  conn.on('ReceiveBatch', onBatch);
  conn.onreconnecting(() => setG('reconnecting…', true));
  conn.onreconnected(() => { setG('live · SID ' + G.sid); conn.invoke('JoinGroup', 'SID-' + G.sid).catch(e => dbg('rejoin failed: ' + e)); });
  conn.onclose(() => setG('stream closed', true));
  await conn.start();
  await conn.invoke('JoinGroup', 'SID-' + G.sid);
  return conn;
}

async function gConnect(sid) {
  if (!window.signalR || !signalR.protocols) { setG('SignalR libs failed to load (CDN blocked?)', true); return; }
  sid = Number(sid) || 0; if (!sid && !($('gwss').value || '').trim()) { setG('enter a session id or a wss url', true); return; }
  try { localStorage.setItem('wec_sid', String(sid)); } catch (e) {}
  if (G.conn) { try { await G.conn.stop(); } catch (e) {} G.conn = null; }
  Object.assign(G, { sid, xy: null, cars: new Map(), pidNum: new Map(), seen: new Set() });
  $('gdbg').textContent = '';
  if (!sid) {
    setG('connecting stream (no SID — just testing the socket)…');
    try { G.conn = await rawConnect(($('gwss').value || '').trim()); }
    catch (e) { dbg('raw wss failed: ' + e.message); setG('wss failed: ' + e.message, true); }
    return;
  }
  setG('loading track…');

  try {
    const tm = await gJson('/live/track-map/' + sid);
    G.raw = tm.points; if (!buildMap()) throw new Error('bad track points');
  } catch (e) {
    dbg('track-map failed: ' + e + ' — trying /gps');
    try { const tm = await gJson('/live/track-map/' + sid + '/gps'); G.raw = tm.points; buildMap(); }
    catch (e2) { dbg('gps track failed: ' + e2); }
  }
  drawMap();

  gJson('/api/v2/public/live/session/' + sid + '/bootstrap?includeViewers=true&includeUnclassifiedRanks=false')
    .then(j => { collectParts(j, false); dbg('bootstrap ok, car numbers mapped: ' + G.pidNum.size); schedDraw(); })
    .catch(e => dbg('bootstrap failed: ' + e));
  gJson('/meta/sessions/' + sid + '/participants')
    .then(j => { collectParts(j, true); dbg('participants ok, mapped: ' + G.pidNum.size); schedDraw(); })
    .catch(e => dbg('participants failed: ' + e));

  setG('connecting stream…');
  const wssUrl = ($('gwss').value || '').trim();
  if (wssUrl) {
    try { G.conn = await rawConnect(wssUrl); return; }
    catch (e) { dbg('raw wss failed: ' + e.message + ' — falling back to negotiate'); }
  }
  const order = G.okBase ? [G.okBase, ...G.bases.filter(b => b !== G.okBase)] : G.bases;
  for (const b of order) {
    try { G.conn = await startHub(b); setG('live · SID ' + sid + (b === '/griiip' ? ' · proxy' : '')); return; }
    catch (e) { dbg('hub via ' + b + ' failed: ' + e); }
  }
  setG('stream connection failed (see Debug)', true);
  $('gdbg').style.display = 'block';
}

// ---------- hardcoded websocket (captured from browser) ----------

function jwtExp(u) {
  try {
    const t = new URL(u).searchParams.get('access_token');
    const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return p.exp * 1000;
  } catch (e) { return null; }
}

function rawConnect(url) {
  const exp = jwtExp(url);
  if (exp) {
    dbg('token expires ' + new Date(exp).toLocaleString() + (exp < Date.now() ? '  (EXPIRED)' : ''));
    if (exp < Date.now()) return Promise.reject(new Error('access_token expired'));
  }
  const proto = new signalR.protocols.msgpack.MessagePackHubProtocol();
  const log = signalR.NullLogger.instance;
  return new Promise((resolve, reject) => {
    let ws, ping, ready = false, settled = false;
    const handle = { stop() { clearInterval(ping); try { ws.close(); } catch (e) {} } };
    const fail = e => { if (!settled) { settled = true; handle.stop(); reject(e); } };
    try { ws = new WebSocket(url); } catch (e) { return reject(e); }
    ws.binaryType = 'arraybuffer';
    const dispatch = buf => {
      let msgs;
      try { msgs = proto.parseMessages(buf, log); } catch (e) { dbg('parse error: ' + e); return; }
      for (const m of msgs) {
        if (m.type === 1 && m.target === 'ReceiveBatch') onBatch(m.arguments[0]);
        else if (m.type === 1) dbg('invocation: ' + m.target);
        else if (m.type === 3) dbg('completion: ' + (m.error ? 'ERROR ' + m.error : 'ok'));
        else if (m.type === 7) dbg('server close: ' + (m.error || ''));
      }
    };
    ws.onopen = () => { dbg('wss open → sending handshake'); ws.send(JSON.stringify({ protocol: 'messagepack', version: 1 }) + '\x1e'); };
    ws.onmessage = ev => {
      if (!ready) {
        const bytes = typeof ev.data === 'string' ? new TextEncoder().encode(ev.data) : new Uint8Array(ev.data);
        const i = bytes.indexOf(0x1e); if (i < 0) return;
        let hs = {}; try { hs = JSON.parse(new TextDecoder().decode(bytes.slice(0, i)) || '{}'); } catch (e) {}
        if (hs.error) return fail(new Error('handshake: ' + hs.error));
        ready = true; dbg('handshake ok');
        if (G.sid) ws.send(proto.writeMessage({ type: 1, invocationId: '1', target: 'JoinGroup', arguments: ['SID-' + G.sid] }));
        ping = setInterval(() => { try { ws.send(proto.writeMessage({ type: 6 })); } catch (e) {} }, 15000);
        setG(G.sid ? 'live (raw wss) · SID ' + G.sid : 'socket connected (no SID → no data)');
        settled = true; resolve(handle);
        const rest = bytes.slice(i + 1); if (rest.length) dispatch(rest.buffer);
        return;
      }
      if (typeof ev.data !== 'string') dispatch(ev.data);
    };
    ws.onerror = () => dbg('wss error (token expired, or the connection id was already used?)');
    ws.onclose = e => {
      dbg('wss closed, code ' + e.code + ' ' + (e.reason || ''));
      if (!settled) fail(new Error('closed before handshake (code ' + e.code + ')'));
      else setG('stream closed (code ' + e.code + ')', true);
    };
  });
}

function deepSessions(o, out, depth = 0) {
  if (!o || typeof o !== 'object' || depth > 7) return;
  if (Array.isArray(o)) { o.forEach(x => deepSessions(x, out, depth + 1)); return; }
  if (typeof o.sid === 'number') out.push(o);
  for (const v of Object.values(o)) if (v && typeof v === 'object') deepSessions(v, out, depth + 1);
}
async function gBrowse() {
  const box = $('gsessions'); box.innerHTML = '<span class="status">searching…</span>';
  try {
    const j = await gJson('/meta/seasons/running/extended');
    const out = []; deepSessions(j, out);
    if (!out.length) { box.innerHTML = '<span class="status bad">no sessions found (see Debug)</span>'; dbg('seasons/running: ' + JSON.stringify(j).slice(0, 400)); return; }
    box.innerHTML = out.slice(0, 60).map(s =>
      `<button class="tab" data-sid="${s.sid}">${esc(s.sid)} · ${esc(s.name || s.sessionName || s.type || s.eventName || '')}</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => { $('gsid').value = b.dataset.sid; gConnect(b.dataset.sid); });
  } catch (e) { box.innerHTML = '<span class="status bad">lookup failed: ' + esc(e.message) + '</span>'; }
}

function renderCompact(shown,list,cm,bestSec,bestAll,bestCat){
 const rows=shown.map(e=>{const foc=Z.follow&&String(Z.sel)===String(e.number),i=list.indexOf(e),pos=cm?e.categoryRanking:e.ranking,chg=cm?e.categoryPositionChange:e.positionChange,

  const sec=[1,2,3].map(n=>{const cur=parseT(e['currentSector'+n]),pb=e['bestTimeSector'+n];let c='';if(!isNaN(cur)){if(bestSec[n]&&cur<=bestSec[n])c='purple';else if(pb&&cur<=pb)c='green'}
   return'<td class="mono c-s '+c+'">'+(isNaN(cur)?'<span class="dim">-</span>':fmtMs(cur))+'</td>'}).join('');
  const ct=chg>0?'<span class="up">▲'+chg+'</span>':chg<0?'<span class="dn">▼'+(-chg)+'</span>':'';
  const st=e.state?String(e.state).toUpperCase():'';
  let r='<tr class="r'+(foc?' foc':'')+'" data-id="'+e.id+'"><td class="cb" style="background:'+col+'"></td><td class="mono p">'+pos+'</td><td class="chg">'+ct+'</td>'+
   '<td><span class="num" style="background:'+col+'">'+esc(e.number)+'</span></td><td class="l tm">'+brandBadge(e.car)+'<span>'+esc(e.team)+'</span></td><td class="l c-drv">'+esc(e.driver)+'</td>'+

   '<br><span class="dim">Best sectors</span> '+[1,2,3].map(n=>e['bestSector'+n]||'-').join(' · ')+' &nbsp; <span class="dim">2nd best</span> '+esc(e.secondBestLap||'-')+' &nbsp; <span class="dim">Speed</span> '+(e.speed&&e.speed!=='-'?Math.round(e.speed)+' km/h':'-')+'</div></td></tr>';

 $('list').innerHTML='<table class="ct"><thead><tr><th></th><th>P</th><th></th><th>#</th><th class="l">Team</th><th class="l c-drv">Driver</th><th>Lap</th><th>Gap</th><th class="c-int">Int</th><th>Last</th><th>Best</th><th class="c-s">S1</th><th class="c-s">S2</th><th class="c-s">S3</th><th>Pit</th><th class="c-st"></th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'}
function applyZ(fast){const w=1000/Z.s;Z.x=Math.max(-400,Math.min(1400-w,Z.x));Z.y=Math.max(-400,Math.min(1400-w,Z.y));const sv=$('gsvg');G.dk=1/Math.pow(Z.s,.55);
 sv.setAttribute('viewBox',Z.x.toFixed(1)+' '+Z.y.toFixed(1)+' '+w.toFixed(1)+' '+w.toFixed(1));if(fast)return;sv.style.touchAction=Z.s>1?'none':'auto';$('zfol').classList.toggle('on',Z.follow);updHud()}
function svgXY(ev){const r=$('gsvg').getBoundingClientRect(),w=1000/Z.s,sc=Math.min(r.width,r.height)/w,ox=(r.width-w*sc)/2,oy=(r.height-w*sc)/2;return[Z.x+(ev.clientX-r.left-ox)/sc,Z.y+(ev.clientY-r.top-oy)/sc,sc]}
function zoomAt(f,cx,cy){const ns=Math.max(1,Math.min(12,Z.s*f)),w0=1000/Z.s,w1=1000/ns;Z.x=cx-(cx-Z.x)*w1/w0;Z.y=cy-(cy-Z.y)*w1/w0;Z.s=ns;applyZ()}
(function(){const sv=$('gsvg');let drag=null;
 sv.addEventListener('wheel',ev=>{ev.preventDefault();const p=svgXY(ev);if(Z.follow){Z.fs=Math.max(1.5,Math.min(10,Z.fs*(ev.deltaY<0?1.2:1/1.2)));return}zoomAt(ev.deltaY<0?1.2:1/1.2,p[0],p[1])},{passive:false});
 sv.addEventListener('pointerdown',ev=>{if(Z.s<=1)return;drag={x:ev.clientX,y:ev.clientY};if(Z.follow){Z.follow=false;applyZ();render()}try{sv.setPointerCapture(ev.pointerId)}catch(e){}});
 sv.addEventListener('pointermove',ev=>{if(!drag)return;const sc=svgXY(ev)[2];Z.x-=(ev.clientX-drag.x)/sc;Z.y-=(ev.clientY-drag.y)/sc;drag={x:ev.clientX,y:ev.clientY};applyZ()});
 sv.addEventListener('pointerup',()=>{drag=null});sv.addEventListener('pointercancel',()=>{drag=null});
 $('zin').onclick=()=>Z.follow?(Z.fs=Math.min(10,Z.fs*1.35)):zoomAt(1.5,Z.x+500/Z.s,Z.y+500/Z.s);$('zout').onclick=()=>Z.follow?(Z.fs=Math.max(1.5,Z.fs/1.35)):zoomAt(1/1.5,Z.x+500/Z.s,Z.y+500/Z.s);
 $('zrst').onclick=()=>{Z.s=1;Z.x=0;Z.y=0;Z.follow=false;Z.fs=3.2;applyZ();render()};

 $('zcls').onclick=()=>{const o=['ALL','HYPERCAR','LMGT3'];G.clsF=o[(o.indexOf(G.clsF)+1)%3];$('zcls').textContent=G.clsF==='ALL'?'ALL':G.clsF==='HYPERCAR'?'HY':'GT3'};

let lastC=performance.now();
function cam(ts){requestAnimationFrame(cam);const dt=Math.min(.1,(ts-lastC)/1000);lastC=ts;
 if(!Z.follow||Z.sel==null||!G.xy||document.hidden)return;
 let c=null;for(const [pid,cc] of G.cars){if(String(G.pidNum.get(String(pid)))===String(Z.sel)){c=cc;break}}
 if(!c||c.pos==null)return;const xy=posAt(c.pos);if(!xy)return;
 const k=1-Math.exp(-dt/.25);Z.s+=(Z.fs-Z.s)*k;const w=1000/Z.s;
 Z.x+=(xy[0]-w/2-Z.x)*k;Z.y+=(xy[1]-w/2-Z.y)*k;applyZ(true)}
requestAnimationFrame(cam);
