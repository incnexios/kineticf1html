<html lang="en">
<head>
<meta charset="UTF-8">

<title>KINETIC / MOBILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root{
  --hdr-h:44px; --sb-h:136px;
  --bg:#0a0a0c; --panel:#141418; --line:#26262e;
  --text:#eceae4; --muted:#84838c; --amber:#ff9a1f; --cyan:#4fd8e8;
  --red:#ff4d4f; --green:#4ade80; --purple:#b98cff; --yellow:#eab308; --blue:#3b82f6;
  --sat-t:env(safe-area-inset-top,0px); --sat-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:#000; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px;}
/* App frame: fluid edge-to-edge on real phone widths, letterboxed to a phone-proportioned
   column on wider/desktop viewports so nothing stretches into giant, unreadable rows. */
#app{position:relative; max-width:480px; margin:0 auto; height:100%; max-height:100dvh; overflow:hidden; background:var(--bg); padding-top:var(--sat-t);}
@media (min-width:481px){ #app{box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6);} }

/* ============================================================
   TRACK-STATUS ATMOSPHERE
   A blurred colour wash sits behind everything; panels are frosted glass on top,
   so the page changes colour with the flag but text/components stay readable.
   ============================================================ */
#atmo{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
#atmo i{position:absolute; inset:-14%; opacity:0; transition:opacity 1s ease; filter:blur(38px); will-change:opacity;
  background:
    radial-gradient(62% 52% at 10% 0%,   rgba(var(--c),.80), transparent 74%),
    radial-gradient(58% 48% at 100% 100%, rgba(var(--c),.68), transparent 74%),
    radial-gradient(75% 65% at 50% 45%,  rgba(var(--c),.34), transparent 80%);}
#atmo i.on{opacity:1;}
#atmo i.s-red{--c:255,59,48;}   #atmo i.s-yellow{--c:250,204,21;}  #atmo i.s-sc{--c:255,122,26;}
#atmo i.s-vsc{--c:255,194,51;}  #atmo i.s-clear{--c:52,211,102;}   #atmo i.s-chq{--c:226,232,240;}
@keyframes atmo-pulse{0%,100%{opacity:.7;}50%{opacity:1;}}
#atmo i.on.s-red{animation:atmo-pulse 1.6s ease-in-out infinite;}
#atmo i.on.s-yellow{animation:atmo-pulse 2.2s ease-in-out infinite;}
#atmo i.on.s-sc{animation:atmo-pulse 2.6s ease-in-out infinite;}
#atmo i.on.s-vsc{animation:atmo-pulse 3.2s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){ #atmo i.on{animation:none!important;} }
header,.statusbar{position:relative; z-index:1; background:rgba(20,20,24,.46)!important; -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);}
nav{z-index:3; background:rgba(20,20,24,.7)!important; -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);}
main{z-index:1;}
.view{background:rgba(10,10,12,.4); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);}
header{display:flex; align-items:center; justify-content:space-between; gap:10px; height:var(--hdr-h); padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel);}
.brand{display:flex; align-items:baseline; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; min-width:0; overflow:hidden; white-space:nowrap;}
#sessionName{overflow:hidden; text-overflow:ellipsis;}
.brand span{color:var(--red);}
.status{display:flex; align-items:center; gap:6px; font-size:9.5px; letter-spacing:.4px; color:var(--muted); flex-shrink:0; margin-left:8px;}
.status .src{display:flex; align-items:center; padding:4px 8px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid var(--line);}
.dot{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:4px;}
.dot.live{background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.6s infinite;}
.dot.off{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.wxbar{display:none;}
.statusbar{height:var(--sb-h); background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column; justify-content:space-between; gap:6px; overflow:hidden;}
.stats{display:grid; grid-template-columns:1.5fr 1fr 1fr 1.1fr; gap:8px;}
.stat{position:relative; overflow:hidden; min-width:0; display:flex; flex-direction:column; gap:4px; padding:7px 10px 8px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid var(--line);}
.sl{font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:9px; line-height:1; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);}
.sv{display:flex; align-items:baseline; gap:4px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; line-height:1.1; white-space:nowrap; font-variant-numeric:tabular-nums;}
.sv > span:first-child:not(#wLap){font-size:14px;}
.stat.lap{background:rgba(79,216,232,.08); border-color:rgba(79,216,232,.4);}
.stat.lap .sl{color:var(--cyan);}
.stat.lap .sv{font-size:23px; font-weight:800;}
.stat.lap small{font-size:13px; font-weight:500; color:var(--muted);}
.lapbar{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.08);}
.lapbar u{display:block; height:100%; width:0; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transition:width .6s ease;}
.clocktxt{color:var(--amber);}
.clocktxt.danger{color:var(--red);}
.clocktxt.stopped{color:var(--muted);}
.sbrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0; min-width:0;}
.flagline{display:flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; white-space:nowrap; min-width:0;}
.flagline .flag-icon{width:18px; height:18px; object-fit:contain;}
.wxline{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;}
.wxline b{color:var(--text); font-weight:500;}
.sbrow.rc{font-size:10px; letter-spacing:.3px; text-transform:uppercase; color:var(--muted); white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.3; flex-shrink:0; min-height:13px; overflow-wrap:anywhere;}
.statusbar .stats,.statusbar .flagrow{flex-shrink:0;}
main{position:absolute; top:0; bottom:0; left:0; right:0; padding-top:calc(var(--hdr-h) + var(--sb-h) + var(--sat-t)); padding-bottom:calc(58px + var(--sat-b)); overflow:hidden;}
.view{display:none; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view.on{display:block;}
#timingList{padding:2px 0 8px;}
.trow{padding:10px 14px 9px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;}
.trow.selected{background:rgba(79,216,232,.08);}
.trow.pit{background:rgba(255,154,31,.07);}
.trow-top{display:flex; align-items:center; gap:7px;}
.pos{width:16px; font-weight:700; font-size:14px; color:var(--muted); flex-shrink:0; text-align:center;}
.posc{width:28px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px;}
.posc .pos{width:auto;}
.pd{font-size:9px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; min-height:9px;}
.pd.up{color:var(--green);} .pd.down{color:var(--red);} .pd.even{color:var(--muted);}
@keyframes pgain{0%{background:rgba(74,222,128,.28);}100%{background:transparent;}}
@keyframes ploss{0%{background:rgba(255,77,79,.28);}100%{background:transparent;}}
.trow.pgain{animation:pgain 3.5s ease-out; box-shadow:inset 3px 0 0 var(--green);}
.trow.ploss{animation:ploss 3.5s ease-out; box-shadow:inset 3px 0 0 var(--red);}
.swatch{width:3px; height:15px; border-radius:2px; flex-shrink:0;}
.avatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; flex-shrink:0; border:1px solid var(--line);}
.avatar[src=""], .avatar.hidden{visibility:hidden;}
.dname{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.3px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.teamlogo{height:11px; width:auto; max-width:34px; object-fit:contain; opacity:.85; flex-shrink:0;}
.drspill{font-size:8px; font-weight:700; padding:2px 5px; border-radius:3px; border:1px solid var(--line); color:var(--muted); flex-shrink:0; letter-spacing:.3px;}
.drspill.open{color:var(--green); border-color:var(--green);}
.pitbadge{font-size:8px; background:var(--amber); color:#111; padding:1px 4px; border-radius:2px; font-weight:700; flex-shrink:0;}
.retbadge{font-size:8px; background:var(--red); color:#111; padding:1px 4px; border-radius:2px; font-weight:700; flex-shrink:0;}
.gapcol{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:1px; flex-shrink:0;}
.gap{font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap;}
.gap.leader{color:var(--amber); letter-spacing:.6px; font-size:11px;}
.interval{font-size:9px; color:var(--muted); white-space:nowrap;}
.trow-mid{display:flex; align-items:center; gap:8px; margin-top:7px; margin-left:26px;}
.msecs{display:flex; gap:8px; flex:1; min-width:0;}
.ms{display:flex; flex-direction:column; gap:3px; min-width:0;}
.sbars{display:flex; gap:1.5px; height:9px;}
.sw{display:block; height:3px; border-radius:1px; background:#2c2c34;}
.sw.g{background:var(--green);} .sw.y{background:var(--amber);} .sw.p{background:var(--purple);}
.ms .st{font-size:10.5px; color:#5d5c66; font-variant-numeric:tabular-nums; white-space:nowrap; height:9px; line-height:9px;}
.ms.g .st{color:var(--green);} .ms.y .st{color:var(--amber);} .ms.p .st{color:var(--purple);}
.seg{flex:1; border-radius:1px; background:#2c2c34;}
.seg.g{background:var(--green);} .seg.y{background:var(--amber);} .seg.p{background:var(--purple);} .seg.b{background:var(--blue);} .seg.pit{background:var(--cyan);}
.tyre-wrap{position:relative; flex-shrink:0; width:22px; height:22px;}
.tyre{width:22px; height:22px; border-radius:50%; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}
.tyre.S{color:var(--red);} .tyre.M{color:var(--amber);} .tyre.H{color:#e8e8e8;} .tyre.I{color:var(--green);} .tyre.W{color:var(--cyan);}
.tyre-age{position:absolute; top:-5px; right:-7px; font-size:8px; color:var(--muted); background:var(--panel); padding:0 2px; border-radius:3px; line-height:1.3;}
.trow-sectors{display:flex; gap:16px; margin-top:5px; margin-left:26px; font-size:10.5px; color:var(--muted);}
.trow-sectors span.g{color:var(--green);} .trow-sectors span.p{color:var(--purple);}
.trow-bottom{display:flex; justify-content:space-between; margin-top:4px; margin-left:26px; font-size:10px; color:var(--muted);}
.trow-bottom b{color:var(--text); font-weight:500;}
.trow-bottom b.fast{color:var(--purple);} .trow-bottom b.pb{color:var(--green);}
.telem{display:flex; gap:9px; margin-top:6px; margin-left:26px; padding-top:6px; border-top:1px dashed var(--line); font-size:9.5px; color:var(--muted); flex-wrap:wrap; row-gap:4px;}
.telem b{color:var(--text); font-weight:600; font-size:11px;}
.telem .drs{padding:1px 6px; border-radius:3px; border:1px solid var(--line);}
.telem .drs.open{color:var(--green); border-color:var(--green);}
.telem .drs.aero.open{color:var(--cyan); border-color:var(--cyan);}
.telem .drs.ot.open{color:var(--purple); border-color:var(--purple); box-shadow:0 0 6px var(--purple);}
.bar{width:34px; height:4px; background:#3a3a42; border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:3px;}
.bar i{display:block; height:100%; background:var(--cyan);}
.bar.brk i{background:var(--red);}
.empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:12px;}
#trackView{position:relative; height:100%;}
#trackCanvas{width:100%; height:100%; display:block; touch-action:none;}
.track-hint{position:absolute; top:12px; left:58px; max-width:40%; font-size:10px; color:var(--muted); background:rgba(20,20,24,.8); padding:5px 9px; border-radius:6px;}
.tvctl{position:absolute; top:10px; z-index:5; display:flex; flex-direction:column; gap:8px;}
.tvctl.l{left:10px;} .tvctl.r{right:10px;}
.tvb{width:38px; height:38px; border-radius:10px; background:rgba(20,20,24,.88); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; padding:0; cursor:pointer; touch-action:none;}
.tvb svg{width:17px; height:17px;}
.tvb.on{background:var(--cyan); color:#0a0a0c; border-color:var(--cyan); box-shadow:0 0 12px rgba(79,216,232,.5);}
.tvfocuslbl{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; display:none; padding:5px 11px; border-radius:999px; background:var(--cyan); color:#0a0a0c; font:700 10px 'JetBrains Mono',monospace; letter-spacing:.6px; white-space:nowrap; pointer-events:none;}
#tvCompass{border-radius:50%;} #tvCompass b{position:absolute; top:2px; font-size:8px; color:var(--muted);}
#tvNeedle{width:3px; height:14px; background:linear-gradient(#ef4444 50%,#52525b 50%); border-radius:2px;}
.tvhid{display:none!important;}
.tvdir{position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none; opacity:0; transition:opacity .25s; padding:4px 12px; border-radius:999px; background:rgba(14,14,18,.9); border:1px solid var(--line); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--cyan);}
.tvdir.on{opacity:1;}
#radioList{padding:8px;}
.filterbar{padding:10px 12px 4px;}
.filterbar select{width:100%; appearance:none; -webkit-appearance:none; background:#eceae4 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23141418" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center/14px; background-color:#eceae4; color:#141418; border:none; border-radius:20px; padding:10px 34px 10px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;}
.rcard{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:8px; padding:10px 12px; margin-bottom:6px;}
.rcard .rmeta{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11px;}
.rcard .ravatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; border:1px solid var(--line);}
.rcard .rtla{font-weight:700; font-size:12px;}
.rcard .rtime{color:var(--muted); margin-left:auto;}
.player{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
.playbtn{
  width:30px; height:30px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  background:var(--amber); color:#12100c; display:flex; align-items:center; justify-content:center;
  font-size:0; position:relative; transition:transform .1s, background .15s;
}
.playbtn:active{transform:scale(.92);}
.playbtn::before{content:''; width:0; height:0; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #12100c; margin-left:2px;}
.playbtn.playing::before{width:9px; height:11px; border-style:none; border-width:0; background:#12100c; box-shadow:4px 0 0 #12100c; margin-left:0; border-radius:1px;}
.playbtn.error{background:var(--red);}
.ptrack{flex:1; height:4px; background:#2a2a32; border-radius:2px; position:relative; cursor:pointer;}
.pfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--amber); border-radius:2px;}
.ptime{font-size:10px; color:var(--muted); flex-shrink:0; width:34px; text-align:right;}
.rcard .line{font-size:12px; margin-top:3px;}
.rcard .line b{color:var(--amber); margin-right:6px;}
#rcList{padding:8px;}
.rc-msg{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.flagchip{width:20px; height:20px; object-fit:contain; flex-shrink:0; margin-top:1px;}
.rc-msg > div{min-width:0; flex:1; overflow-wrap:anywhere; line-height:1.35;}
.dotchip{position:relative; display:inline-block;}
.dotchip::after{content:''; position:absolute; left:6px; top:6px; width:8px; height:8px; border-radius:50%; background:#6b7280;}
.dotchip.pen::after{background:var(--red);} .dotchip.blue::after{background:#3b82f6;} .dotchip.flag::after{background:var(--amber);}
.rc-msg .t{color:var(--muted); font-size:10px; display:block; margin-bottom:2px;}
nav{position:absolute; left:0; right:0; bottom:0; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--sat-b);}
nav button{flex:1; background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:500; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px;}
nav button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;}
nav button.on{color:var(--red);}
.tdetail{margin:7px 0 0 26px; padding-top:7px; border-top:1px dashed var(--line); font-size:11px; line-height:1.4;}
.tdetail .dgrid{display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); margin-bottom:4px;}
.tdetail .dgrid b{color:var(--text); font-weight:500;}
.tdetail .inc{padding:2px 0;} .tdetail .inc .t{color:var(--muted); margin-right:6px;}
.tbar{position:sticky; top:0; z-index:3; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 14px; border-bottom:1px solid var(--line); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.seg2{display:inline-flex; flex-shrink:0;}
.seg2 button{font:inherit; font-size:10px; letter-spacing:.4px; background:none; color:var(--muted); border:1px solid var(--line); padding:4px 11px; cursor:pointer;}
.seg2 button:first-child{border-radius:6px 0 0 6px;} .seg2 button:last-child{border-radius:0 6px 6px 0; border-left:none;}
.seg2 button.on{color:var(--text); background:var(--panel);}
::-webkit-scrollbar{width:0; height:0;}

#view-track.on{display:flex; flex-direction:column;}
#view-track #trackView{flex:1; min-height:120px; height:auto; overflow:hidden;}
#trackCanvas{position:absolute; left:0; top:0;}
#battles{flex-shrink:0; max-height:48%; overflow-y:auto; border-top:1px solid var(--line); background:var(--panel);}
.bhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 12px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--line);}
.bhead select{flex:1; min-width:130px; background:#eceae4; color:#141418; border:none; border-radius:14px; padding:5px 10px; font:inherit; font-size:11px; text-transform:none; font-weight:600;}
.bhead label{display:flex; align-items:center; gap:5px; cursor:pointer;} .bhead input[type=range]{width:80px;} .bhead b{color:var(--text); font-weight:500; text-transform:none;}
.bt{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
.bt td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;}
.bt td.ml{text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; width:22%;}
.bt td.diff{color:var(--muted);} .bt .faster{color:var(--green);} .bt .slower{color:var(--red);}
.bdrv{display:flex; align-items:center; justify-content:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;}
.bavatar{width:36px; height:36px; border-radius:50%; object-fit:cover; background:#1c1c22; border:2px solid var(--line); flex-shrink:0;}
.bavatar.hidden{visibility:hidden;}
.bdrs{width:8px; height:8px; border-radius:50%; background:#3a3a42; display:inline-block;} .bdrs.on{background:var(--green); box-shadow:0 0 6px var(--green);}
.bgap{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; transition:color .3s;}
.bgap.gap-increasing{color:var(--red);} .bgap.gap-decreasing{color:var(--green);}
.bmsg{padding:16px; text-align:center; color:var(--muted); font-size:12px;}
#view-rc .tbar{flex-wrap:wrap; row-gap:6px;}
.rcchips{display:flex; flex-wrap:wrap; gap:6px;}
.rcchips button{font:inherit; font-size:10px; letter-spacing:.4px; text-transform:none; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
.rcchips button i{font-style:normal; font-size:9px; opacity:.75; font-variant-numeric:tabular-nums;}
.rcchips button.on{color:#0a0a0c; background:var(--cyan); border-color:var(--cyan); font-weight:600;}
.rcchips button.on i{opacity:.8;}
#view-insights .tbar{flex-wrap:wrap; row-gap:4px;} #flCtl .insel{max-width:90px;}
.insel{background:#eceae4; color:#141418; border:none; border-radius:12px; padding:3px 8px; font:inherit; font-size:10px; max-width:110px;}
.strow{display:flex; align-items:center; gap:6px; padding:4px 10px; border-bottom:1px solid var(--line); cursor:pointer;} .strow:hover{background:rgba(255,255,255,.04);}
.stpos{width:18px; font-weight:700; color:var(--muted); font-size:11px; text-align:right;} .stsw{width:3px; height:14px; border-radius:2px; flex-shrink:0;}
.sttla{width:34px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px;}
.stline{display:flex; flex:1; min-width:0; align-items:center; height:22px; overflow:hidden;}
.stseg{position:relative; height:100%; display:flex; align-items:center; min-width:40px;}
.stbar{position:absolute; left:0; right:0; top:50%; height:2px; transform:translateY(-50%);}
.stpill{position:relative; display:flex; align-items:center; gap:3px; padding:1px 5px 1px 2px; background:#1c1c22; border:1px solid var(--line); border-radius:11px; font-size:10px;}
.sti{width:16px; height:16px;} .stpill b{font-weight:700;}
.spt{width:100%; border-collapse:collapse; font-size:12px;} .spt th{color:var(--muted); font-size:10px; font-weight:500; padding:6px 8px; text-align:center; position:sticky; top:0; background:var(--bg);}
.spt td{padding:5px 8px; text-align:center; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;} .spt td:nth-child(2){text-align:left;}
.spt .top{color:var(--purple); font-weight:700;} .sdrv{display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:700;}
.sdrv img{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; border:1px solid var(--line);} .sdrv img.hidden{visibility:hidden;}
.flw{padding:10px 12px; display:flex; flex-direction:column; gap:8px;}
.flh{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); padding:5px 8px; border-radius:6px; border-bottom:2px solid #555;}
.flpos{background:#fff; color:#000; font-weight:800; font-size:12px; padding:1px 6px; border-radius:3px;} .flh img.fa{width:28px; height:28px; border-radius:50%; object-fit:cover; background:#1c1c22;} .flh img.fa.hidden{visibility:hidden;}
.flh img.fl{height:16px; max-width:34px; object-fit:contain;} .flh .flt{font-family:'Space Grotesk',sans-serif; font-weight:700; flex:1;} .flh .flt small{opacity:.7; font-weight:500; margin-left:4px;} .flh img.fy{width:20px; height:20px;}
.flrow{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
.fltime{font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
.fltg{background:rgba(255,255,255,.06); padding:4px 8px; border-radius:5px; font-size:10px; line-height:1.3;} .fltg b{display:block; font-size:12px; font-weight:600;}
.flsecs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;} .flsec{background:rgba(0,0,0,.3); border-radius:4px; padding:5px; display:flex; flex-direction:column; gap:4px;}
.flsd{display:flex; justify-content:space-between; font-size:10px;} .flsd span:first-child{opacity:.7; font-weight:700;}
.flms{display:flex; height:6px; background:#333; border-radius:2px; overflow:hidden; gap:1px;} .flms i{flex:1; background:#444;}
.flms i.s{background:#f2e205;} .flms i.g{background:#00f500;} .flms i.p{background:#b300b3;} .flms i.b{background:#2196f3;}

/* ---- track-map telemetry HUD ---- */
.tvhud{position:absolute; left:10px; right:10px; bottom:10px; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:9px 11px; border-radius:12px; background:rgba(14,14,18,.9); border:1px solid var(--line); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); font-variant-numeric:tabular-nums;}
.hud-grp{display:flex; align-items:center; gap:8px; min-width:0;}
.hud-pos{display:flex; border-radius:6px; overflow:hidden; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:15px; line-height:1; flex-shrink:0;}
.hud-pos b{background:#fff; color:#000; padding:7px 8px; min-width:26px; text-align:center;}
.hud-pos span{color:#fff; padding:7px 10px; letter-spacing:.5px;}
.hud-delta{font-size:11px; font-weight:700; min-width:26px; text-align:center;}
.hud-delta.up{color:var(--green);} .hud-delta.down{color:var(--red);} .hud-delta.even{color:var(--muted);}
.hud-ot{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:40px; cursor:help;}
.hud-ot b{font-size:10px; font-weight:800; letter-spacing:.8px; padding:3px 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted);}
.hud-ot b{min-width:34px; text-align:center;}
.hud-ot.ot b{color:#fff; background:var(--purple); border-color:var(--purple); box-shadow:0 0 10px var(--purple);}
.hud-ot.bst b{color:#1a1200; background:var(--amber); border-color:var(--amber); box-shadow:0 0 10px var(--amber);}
.hud-ot.sm b{color:#04161a; background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px var(--cyan);}
.hud-brk{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:34px;}
.hud-brk b{font-size:10px; font-weight:800; letter-spacing:.8px; padding:3px 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted); min-width:34px; text-align:center;}
.hud-brk.on b{color:#fff; background:var(--red); border-color:var(--red); box-shadow:0 0 10px var(--red);}
.hud-brk .bbar{width:34px; height:4px; background:#3a3a42; border-radius:2px; overflow:hidden;}
.hud-brk .bbar i{display:block; height:100%; background:var(--red); transition:width .15s linear;}
.hud-brk em{font-style:normal; font-size:8px; letter-spacing:.5px; color:var(--muted); min-height:9px;}
.hud-brk.on em{color:var(--red);}
.hud-ot em{font-style:normal; font-size:8px; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; min-height:9px;}
.hud-ot.ot em{color:var(--purple);} .hud-ot.bst em{color:var(--amber);} .hud-ot.sm em{color:var(--cyan);}
.hud-gauge{position:relative; width:50px; height:50px; flex-shrink:0;}
.hud-gauge svg{width:50px; height:50px; transform:rotate(135deg);}
.hud-gauge circle{fill:none; stroke-width:4.5; stroke-linecap:round;}
.hud-gauge .bg{stroke:#2c2c34;} .hud-gauge .fg{stroke:var(--cyan); transition:stroke-dasharray .25s linear;} .hud-gauge .fg.hot{stroke:var(--red);}
.hud-gauge .gear{position:absolute; left:0; right:0; top:11px; text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:17px; line-height:1;}
.hud-gauge .rpm{position:absolute; left:0; right:0; bottom:5px; text-align:center; font-size:8.5px; color:var(--muted);}
.hud-spd{display:flex; flex-direction:column; align-items:center; padding:5px 9px; border-radius:8px; background:rgba(255,255,255,.07); cursor:pointer; flex-shrink:0; min-width:54px;}
.hud-spd b{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:800; line-height:1;}
.hud-spd.slow b{color:var(--red);}
.hud-spd small{font-size:8px; color:var(--muted);}
.hud-laps{display:grid; grid-template-columns:auto auto; gap:3px 8px; align-items:center; font-size:12px; font-weight:700;}
.hud-laps i{font-style:normal; font-size:8.5px; color:var(--muted); letter-spacing:.6px; font-weight:500;}
.hud-laps .pill{padding:2px 8px; border-radius:999px; text-align:center;}
.hud-laps .g{color:var(--green);} .hud-laps .p{color:var(--purple);}
.hud-laps .pill.g{background:rgba(74,222,128,.16);} .hud-laps .pill.p{background:rgba(168,85,247,.2);}
.hud-gaps{display:grid; grid-template-columns:auto auto; gap:3px 8px; align-items:center; font-size:12px; font-weight:700;}
.hud-gaps i{font-style:normal; font-size:8.5px; color:var(--muted); letter-spacing:.6px; font-weight:500;}
.hud-gaps .pill{padding:2px 8px; border-radius:999px; border:1px solid var(--line); text-align:center;}
.hud-gaps .pill.g{color:var(--green); border-color:var(--green);}
.hud-secs{display:flex; gap:8px; min-width:150px; flex:1;}
.hud-secs .ms{flex:1; min-width:34px;} .hud-secs .ms .st{height:auto; line-height:1.3; font-size:11px; margin-top:2px;}
.hud-secs .sbars{height:7px;}
.hud-tyre{cursor:pointer; flex-shrink:0; margin-left:auto; padding:4px 6px 0 0;}
@media (min-width:820px){
  #app{max-width:none; box-shadow:none; display:flex; flex-direction:column;}
  header{height:auto; min-height:54px; padding:8px 22px; flex-shrink:0;} .brand{font-size:18px;} body{font-size:14px;}
  .status{gap:8px; font-size:10.5px;} .status .src{padding:5px 11px;}
  .statusbar{height:auto; flex-direction:row; align-items:stretch; justify-content:flex-start; gap:22px; padding:12px 22px; flex-shrink:0; overflow:visible;}
  .stats{display:flex; gap:12px;}
  .stat{min-width:104px; padding:9px 18px 11px; gap:6px;}
  .stat.lap{min-width:170px;}
  .sl{font-size:10px;} .sv{font-size:21px;} .stat.lap .sv{font-size:30px;} .stat.lap small{font-size:16px;} .sv > span:first-child:not(#wLap){font-size:17px;}
  .statusbar .flagrow{flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; flex-shrink:0; min-width:170px;}
  .flagline{font-size:15px;} .wxline{font-size:12px; overflow:visible;}
  .statusbar .sbrow.rc{flex:1; min-width:0; align-self:center; font-size:11px; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  main{position:static; flex:1; min-height:0; padding:12px; display:grid; gap:12px;
       grid-template-columns:minmax(380px,1.15fr) minmax(300px,1.3fr) minmax(280px,.8fr);
       grid-template-rows:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);}
  nav{display:none;}
  .view,.view.on{display:block; height:100%; min-height:0; overflow-y:auto; background:rgba(10,10,12,.4);
       -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
       border:1px solid rgba(255,255,255,.08); border-radius:10px;}
  #view-timing{grid-column:1; grid-row:1 / span 3;}
  #view-track{grid-column:2; grid-row:1 / span 3; overflow:hidden; display:flex; flex-direction:column;}
  #view-radio{grid-column:3; grid-row:1;}
  #view-insights{grid-column:3; grid-row:2;}
  #view-rc{grid-column:3; grid-row:3;}
  #trackView{height:100%;}
  .tbar{border-radius:10px 10px 0 0;} .trow:hover{background:rgba(255,255,255,.04);}
  .tvctl.l,.tvctl.r{top:14px;} .tvctl.l{left:14px;} .tvctl.r{right:14px;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:#2c2c34; border-radius:3px;}
}
</style>
</head>
<body>
<div id="app">
<div id="atmo" aria-hidden="true"><i class="s-red"></i><i class="s-yellow"></i><i class="s-sc"></i><i class="s-vsc"></i><i class="s-clear"></i><i class="s-chq"></i></div>
<header>
  <div class="brand">KINETIC<span>/</span><span id="sessionName" style="color:var(--muted); font-size:11px; font-weight:400;">—</span></div>
  <div class="status">
    <span class="src"><span class="dot off" id="dotTiming"></span>TIMING</span>
    <span class="src"><span class="dot off" id="dotMain"></span>LIVE</span>
    <span class="src"><span class="dot off" id="dotRadio"></span>RADIO</span>
  </div>
</header>
<div class="statusbar">
  <div class="stats">
    <div class="stat lap"><span class="sl">Lap</span><b class="sv"><span id="wLap">—</span><small id="wLapTotal">/—</small></b><i class="lapbar"><u id="wLapBar"></u></i></div>
    <div class="stat"><span class="sl">Air</span><b class="sv"><span id="wxIcon">☀️</span><span id="wAir">—°</span></b></div>
    <div class="stat"><span class="sl">Track</span><b class="sv"><span id="wTrack">—°</span></b></div>
    <div class="stat"><span class="sl" id="clockLbl">Clock</span><b class="sv clocktxt" id="wClock">—</b></div>
  </div>
  <div class="sbrow flagrow">
    <span class="flagline"><span id="flagIcon">🏁</span><b id="statusText">Live</b></span>
    <span class="wxline"><span id="wCond">—</span><b id="wHum" class="sp"></b><b id="wWind" class="sp"></b></span>
  </div>
  <div class="sbrow rc" id="rcTicker">—</div>
</div>
<main>
  <div class="view on" id="view-timing">
    <div class="tbar"><span id="secLabel">Mini sectors</span><span class="seg2" id="secToggle"><button data-m="mini">Mini</button><button data-m="times">Times</button></span></div>
    <div id="timingList"><div class="empty">Connecting to pitwall feed…</div></div></div>
  <div class="view" id="view-track"><div id="trackView"><canvas id="trackCanvas"></canvas>
    <div class="tvctl l">
      <button class="tvb" id="tvCompass" title="Tap to turn the map N → E → S → W · drag to rotate freely"><b>N</b><div id="tvNeedle"></div></button>
      <button class="tvb" id="tvReset" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div class="tvfocuslbl" id="tvFocusLbl"></div>
    <div class="tvdir" id="tvDirLbl"></div>
    <div class="tvhud" id="tvHud" style="display:none"></div>
    <div class="tvctl r">
      <button class="tvb" id="tvFocus" title="Focus: zoom in and follow the selected driver (follows the leader if none is selected)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="tvb" id="tvRecenter" title="Recenter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
      <button class="tvb" id="tvZin" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></button>
      <button class="tvb" id="tvZout" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg></button>
    </div><div class="track-hint" id="trackHint">Connecting…</div></div><div id="battles"><div class="bhead"><span>Battles</span><select id="bSel"><option value="">Select a battle</option></select><label title="Auto-select the closest battle"><input type="checkbox" id="bAuto">Auto</label><label>Gap ≤ <input type="range" id="bThr" min="0.5" max="5" step="0.1" value="1.5"><b id="bThrV">1.5s</b></label></div><div id="bBody"><div class="bmsg">No close battles on track at the moment.</div></div></div></div>
  <div class="view" id="view-radio">
    <div class="filterbar"><select id="radioFilter"><option value="">Filter by drivers</option></select></div>
    <div id="radioList"><div class="empty">No transcripts yet.</div></div>
  </div>
  <div class="view" id="view-insights"><div class="tbar"><span class="seg2" id="insTabs"><button data-t="tyres" class="on">Strategy</button><button data-t="speed">Speed trap</button><button data-t="fly">Flying lap</button></span><span id="flCtl" style="display:none;align-items:center;gap:8px"><select id="flSel" class="insel"><option value="">Auto</option></select><label style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="flAuto" checked>Auto</label></span></div><div id="insBody"></div></div>
  <div class="view" id="view-rc">
    <div class="tbar"><span>Race control</span><span class="rcchips" id="rcFilters"><button data-f="flag">Flags<i></i></button><button data-f="pen">Penalties<i></i></button><button data-f="blue">Blue flags<i></i></button><button data-f="other">Other<i></i></button></span></div>
    <div id="rcList"><div class="empty">No messages yet.</div></div></div>
</main>
<nav>
  <button class="on" data-view="timing"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Timing</button>
  <button data-view="track"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Track</button>
  <button data-view="radio"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-7v14l-3-7H4z"/></svg>Radio</button>
  <button data-view="insights"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/></svg>Stats</button>
  <button data-view="rc"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.9L20 9l-4.6 3.8L16.9 19 12 15.6 7.1 19l1.5-6.2L4 9l5.6-1.1z"/></svg>RC</button>
</nav>
</div>

<script>
/* ============================================================
   MAIN SOURCE — timing / weather / RC / track / telemetry
   pitwall.me feed, ported from track.html
   ============================================================ */
const MAIN_WS = "wss://api.pitwall.me/ws";
let state = {}, dirty = true, wsMain = null, backoffMain = 2000;
let circuitKey = null, telemetry = {};
let lastMainTiming = 0, lastMainCar = 0;   // when pitwall last delivered timing / car telemetry (drives the f1pedia fallback)
const mainStale = t => performance.now() - t > 8000;
let selectedDriver = null; // car number (string), selected from the Timing list or tapped on the Track map

// 2026 grid team logos (with number logos) + driver portraits, keyed by TLA.
const DRIVER_ASSETS = {
  NOR: { teamLogo: "https://images.prismic.io/formula-1-dashboard/Z7ZYlJ7c43Q3f_Pd_mclaren-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mclaren/lannor01/2026mclarenlannor01numberwhitefrless.webp" },
  PIA: { teamLogo: "https://images.prismic.io/formula-1-dashboard/Z7ZYlJ7c43Q3f_Pd_mclaren-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mclaren/oscpia01/2026mclarenoscpia01numberwhitefrless.webp" },
  RUS: { teamLogo: "https://images.prismic.io/formula-1-dashboard/Z7ZYkZ7c43Q3f_Pa_mercedes-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mercedes/georus01/2026mercedesgeorus01numberwhitefrless.webp" },
  ANT: { teamLogo: "https://images.prismic.io/formula-1-dashboard/Z7ZYkZ7c43Q3f_Pa_mercedes-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/mercedes/andant01/2026mercedesandant01numberwhitefrless.webp" },
  VER: { teamLogo: "https://images.prismic.io/formula-1-dashboard/aS9MoHNYClf9nuMb_rbr-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/redbullracing/maxver01/2026redbullracingmaxver01numberwhitefrless.webp" },
  HAD: { teamLogo: "https://images.prismic.io/formula-1-dashboard/aS9MoHNYClf9nuMb_rbr-normalized-logo.png", numberLogo: "https://media.formula1.com/image/upload/c_fit,w_876,h_742/q_auto/v1740000001/common/f1/2026/redbullracing/isahad01/2026redbullracingisahad01numberwhitefrless.webp" },

    if (d.status==='fulfilled') kMerge(ks, {DriverList: d.value.DriverList || d.value});
    if (w.status==='fulfilled') kMerge(ks, {WeatherData: w.value.WeatherData || w.value});
    if (si.status==='fulfilled') kMerge(ks, {SessionInfo: si.value.SessionInfo || si.value});
    dirty = true;
  } catch(e){ /* REST bootstrap best-effort only */ }
}

function connectK(){
  setDot('dotTiming','connecting');
  try { sockK = new WebSocket(EP.ws); } catch(e){ scheduleK(); return; }
  sockK.onopen = () => {
    setDot('dotTiming','live');
    backoffK = 1000;
    try { sockK.send(JSON.stringify({ping:true})); } catch(e){}
  };
  sockK.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    if (msg.type === 'snapshot' && msg.state){
      kMerge(ks, msg.state); dirty = true;
    } else if (msg.type === 'delta' && msg.topic){
      kMerge(ks, { [msg.topic]: msg.data }); dirty = true;
      if (msg.topic === 'TimingData') pollSoon();
    } else if (msg.type === 'error'){
      console.warn('kineticws error:', msg.error);
    }
  };
  sockK.onclose = () => { setDot('dotTiming','off'); sockK = null; scheduleK(); };
  sockK.onerror = () => { try{ sockK.close(); }catch(e){} };
}
function scheduleK(){ setTimeout(connectK, backoffK); backoffK = Math.min(backoffK * 1.6, 15000); }

function toList(x){
  if (Array.isArray(x)) return x;
  if (x && typeof x === 'object') return Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]);
  return [];
}
function esc(t){ return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// F1 mini-sector status codes: 2048 yellow, 2049 green (PB), 2051 purple (overall best), 2064 pit lane, 0 = not set
function segClass(st){
  if (st === 2051) return 'p';
  if (st === 2049) return 'g';
  if (st === 2064) return 'pit';
  if (st) return 'y';
  return '';
}
function secClass(v){
  if (v.overallFastest || v.OverallFastest) return 'p';      // purple: session-fastest
  if (v.personalFastest || v.PersonalFastest) return 'g';    // green: own best
  if (v.time || v.Value) return 'y';                         // yellow: slower than own best
  return '';                                                 // grey: no time
}
let secMode = (() => { try { return localStorage.getItem('secMode') || 'mini'; } catch(e){ return 'mini'; } })();

function fmtGap(v, pos){
  if (v === undefined || v === null || v === '') return pos === 1 ? 'Leader' : '—';
  v = String(v);
  if (/^\d+L$/i.test(v)) return '+' + v.toUpperCase();            // lapped: "6L" -> "+6L"
  if (/^\d+(\.\d+)?$/.test(v)) return '+' + v;
  return v;
}
function lapSecs(t){
  const m = typeof t === 'string' && t.match(/^(?:(\d+):)?(\d+\.\d+)$/);
  return m ? (+(m[1] || 0)) * 60 + parseFloat(m[2]) : Infinity;
}
function rawStint(num, line){
  const app = (ks.TimingAppData && ks.TimingAppData.Lines && ks.TimingAppData.Lines[num]) || (state.TimingAppData && state.TimingAppData.Lines && state.TimingAppData.Lines[num]);
  let l = toList(app && app.Stints);
  if (!l.length) l = toList(line.Stints);
  if (!l.length && line.Stint) l = [line.Stint];
  return l[l.length - 1] || null;
}

// Normalised payload from the worker: ks.drivers[]  |  raw SignalR: TimingData.Lines + DriverList (+ TimingAppData)
function buildRows(){
  if (Array.isArray(ks.drivers) && ks.drivers.length){
    const rawLines = (ks.TimingData && ks.TimingData.Lines) || {};
    return ks.drivers.map(d => ({
      segs: toList((rawLines[d.num] || {}).Sectors).slice(0,3).map(x => toList(x && x.Segments)),
      num: d.num, team: d.team, laps: d.laps, stops: d.stops,
      pos: parseInt(d.position ?? 999, 10), tla: d.tla || d.num, name: d.name || '',
      grid: parseInt(d.grid ?? d.gridPos ?? d.gridPosition ?? d.startingPosition ?? d.startPos ?? '', 10),
      color: d.colour ? '#' + String(d.colour).replace('#','') : '#555',
      gap: d.gapToLeader, interval: d.interval, last: d.lastLap || '—', best: d.bestLap || '—',
      sectors: d.sectors, comp: d.tyre, age: d.tyreAge, pit: d.inPit, ret: d.retired
    }));
  }
  const hasK = ks.TimingData && ks.TimingData.Lines && Object.keys(ks.TimingData.Lines).length;
  const drivers = (hasK && ks.DriverList && Object.keys(ks.DriverList).length ? ks.DriverList : state.DriverList) || ks.DriverList || {};
  const lines = (hasK ? ks.TimingData.Lines : (state.TimingData && state.TimingData.Lines)) || {};
  return Object.keys(lines).map(num => {
    const line = lines[num] || {}, drv = drivers[num] || {};
    const st = rawStint(num, line);
    const gap = (line.GapToLeader && line.GapToLeader.Value !== undefined) ? line.GapToLeader.Value : (line.GapToLeader ?? line.Gap);
    const ivl = (line.IntervalToPositionAhead && line.IntervalToPositionAhead.Value) ?? line.Interval;
    return {
      num, team: drv.TeamName, laps: line.NumberOfLaps, stops: line.NumberOfPitStops,
      pos: parseInt(line.Position ?? 999, 10), tla: drv.Tla || drv.tla || num,
      grid: parseInt(drv.StartingPosition ?? line.GridPosition ?? line.StartingPosition ?? '', 10),
      name: drv.FullName || drv.BroadcastName || '',
      color: drv.TeamColour ? '#' + drv.TeamColour.replace('#','') : '#555',
      gap, interval: ivl, last: fmtLap(line.LastLapTime), best: fmtLap(line.BestLapTime),
      sectors: line.Sectors,
      comp: st && (st.Compound || st.compound), age: st && (st.TotalLaps ?? st.LapsOnTyre ?? st.age),
      pit: line.InPit || line.PitOut, ret: line.Retired || line.Stopped
    };
  });
}

function getRC(){
  if (Array.isArray(ks.rcList) && ks.rcList.length) return ks.rcList;
  const k = toList(ks.RaceControlMessages && ks.RaceControlMessages.Messages);
  if (k.length) return k;
  return toList(state.RaceControlMessages && state.RaceControlMessages.Messages);   // last resort: pitwall's copy
}
function rcNoise(m){
  return (m.Category === 'Flag' && m.Scope === 'Sector') || /SLIPPERY|MARSHALS ON TRACK|GRIP|CLIMATIC|RECOVERY VEHICLE/.test(m.Message || '');
}

async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
function finished(){ const st = ks.sess && ks.sess.status; return !!st && st.Started === 'Finished'; }

async function pollTiming(){
  if (document.hidden) return;
  try {
    const j = await getJSON(EP.timing);
    if (Array.isArray(j.drivers)) ks.drivers = j.drivers;
    if (j.lap) ks.lap = j.lap;
    dirty = true;
  } catch(e){}
}
async function pollMeta(){
  if (document.hidden) return;
  const [se, tr, rc, wx] = await Promise.allSettled([
    getJSON(EP.session), getJSON(EP.track), getJSON(EP.raceControl), getJSON(EP.weather)
  ]);
  if (se.status === 'fulfilled'){ ks.sess = se.value; if (se.value.lap) ks.lap = se.value.lap; }
  if (tr.status === 'fulfilled') ks.track = tr.value;
  if (rc.status === 'fulfilled' && Array.isArray(rc.value)) ks.rcList = rc.value;
  if (wx.status === 'fulfilled') kMerge(ks, { WeatherData: wx.value });
  dirty = true;
}
let lastPoll = 0;
function pollSoon(){ if (Date.now() - lastPoll > 1000){ lastPoll = Date.now(); pollTiming(); } }
function loop(fn, liveMs, idleMs){ (async function tick(){ await fn(); setTimeout(tick, finished() ? idleMs : liveMs); })(); }

/* ============================================================
   RADIO SOURCE — transcripts only, from f1pedia
   ============================================================ */
const RADIO_WS = "wss://f1.f1pedia.com/api/v1/live/ws";
let radioSnap = null, wsRadio = null, backoffRadio = 2000, radioDirty = true;

// f1pedia frames may be plain JSON text or zlib/gzip/raw-deflate binary
function decodeFrame(d){
  if (typeof d === 'string') return d;
  const u = new Uint8Array(d), t = new TextDecoder().decode(u);
  if (t.trimStart()[0] === '{') return t;
  for (const f of [pako.inflate, pako.ungzip, pako.inflateRaw]){ try{ return new TextDecoder().decode(f(u)); }catch(err){} }
  throw new Error('undecodable frame');
}
/* ---- f1pedia fallback: car telemetry when pitwall CarData is silent ---- */
function applyFpTelemetry(s){
  if (!mainStale(lastMainCar)) return;            // pitwall CarData is flowing -> keep it
  const cd = s.car_data_by_driver; if (!cd) return;
  for (const num in cd){
    const c = cd[num] || {};
    telemetry[num] = {
      rpm: c.rpm, speed: c.speed, gear: c.gear,
      throttle: (c.throttle >= 0 && c.throttle <= 100) ? c.throttle : 0,
      brake: c.brake > 0 ? 100 : 0,
      drs: c.drs
    };
  }
  dirty = true;
}

function connectRadio(){
  setDot('dotRadio','connecting');
  try{ wsRadio = new WebSocket(RADIO_WS); }catch(e){ scheduleRadio(); return; }
  wsRadio.binaryType = 'arraybuffer';
  wsRadio.onopen = () => { setDot('dotRadio','live'); backoffRadio = 2000; };
  wsRadio.onmessage = (e) => {
    let m;
    try{ m = JSON.parse(decodeFrame(e.data)); }catch(err){ return; }
    if (m && m.snapshot){ radioSnap = m.snapshot; radioDirty = true; TM.pushFp(m.snapshot); applyFpTelemetry(m.snapshot); }
  };
  wsRadio.onclose = () => { setDot('dotRadio','off'); wsRadio = null; scheduleRadio(); };
  wsRadio.onerror = () => {};
}
function scheduleRadio(){ setTimeout(connectRadio, backoffRadio); backoffRadio = Math.min(backoffRadio*1.6, 20000); }

/* ============================================================
   RENDER — timing / weather / rc
   ============================================================ */
function fmtLap(v){ if(!v) return '—'; if (typeof v==='object') v=v.Value; return v || '—'; }
function tyreBadge(comp, age){
  if (!comp) return '<div class="tyre-wrap"></div>';
  const c = String(comp)[0].toUpperCase();
  const known = 'SMHIW'.includes(c);
  const a = (age ?? '') !== '' ? age : '';
  return `<div class="tyre-wrap"><div class="tyre ${known ? c : ''}">${known ? c : '?'}</div>${a !== '' ? `<span class="tyre-age">${a}</span>` : ''}</div>`;
}
// One row of the mini-sector / sector-time strip. mini = per-segment colours, times = sector time; both end in a sector-status bar.
function sectorStrip(sectors, rawSegs){
  const list = toList(sectors).slice(0,3);
  while (list.length < 3) list.push(null);
  return '<div class="msecs">' + list.map((s, i) => {
    const v = (s && typeof s === 'object') ? s : {};
    const cls = secClass(v);
    const time = v.time ?? v.Value ?? '';
    let segs = toList(v.Segments || v.segments);
    if (!segs.length && rawSegs && rawSegs[i]) segs = rawSegs[i];
    const useSegs = secMode === 'mini' && segs.length > 0;
    const top = useSegs
      ? `<span class="sbars">${segs.map(sg => `<i class="seg ${segClass((sg && typeof sg === 'object') ? (sg.Status ?? sg.status) : sg)}"></i>`).join('')}</span>`
      : `<span class="st">${esc(time) || '—'}</span>`;
    const weight = useSegs ? segs.length : (secMode === 'mini' ? 5 : 1);
    return `<span class="ms ${cls}" style="flex:${weight}">${top}<i class="sw ${cls}"></i></span>`;
  }).join('') + '</div>';
}
function shortName(name, tla){
  if (!name) return String(tla);
  const p = String(name).trim().split(/\s+/);
  return (p.length > 1 ? p[0][0] + ' ' + p.slice(1).join(' ') : p[0]).toUpperCase();
}
function detailHtml(r, msgs){
  const mine = msgs.filter(m => (m.Message || '').includes('(' + r.tla + ')'));
  const blue = mine.filter(m => m.Flag === 'BLUE').length;
  const list = mine.filter(m => m.Flag !== 'BLUE').slice(-6).reverse();
  return `<div class="tdetail">
    <div class="dgrid"><span>Team <b>${esc(r.team || '—')}</b></span><span>Laps <b>${r.laps ?? '—'}</b></span><span>Stops <b>${r.stops ?? '—'}</b></span><span>Blue flags <b>${blue}</b></span></div>
    ${list.length ? list.map(m => `<div class="inc"><span class="t">L${m.Lap ?? '?'}</span>${esc(m.Message)}</div>`).join('') : '<div style="color:var(--muted)">Nothing logged for this driver.</div>'}
  </div>`;
}
/* Grid positions: use the feed's value when it has one, otherwise remember each driver's first
   race position (opening laps only) so the +/- never has to be guessed mid-race. */
let gridMap = {}, gridKey = '', prevPos = {}, posFlash = {};
function isRaceSession(){
  const n = document.getElementById('sessionName').textContent || '';
  return /race|sprint/i.test(n) && !/qualif|shootout/i.test(n);
}
function trackGridAndMoves(rows, raceMode){
  const key = document.getElementById('sessionName').textContent;
  if (key !== gridKey){ gridKey = key; gridMap = {}; prevPos = {}; posFlash = {}; }
  const lc = ((ks.lap && ks.lap.TotalLaps) ? ks.lap : state.LapCount) || {};
  const early = lc.CurrentLap == null || lc.CurrentLap <= 2;
  const now = Date.now();
  rows.forEach(r => {
    if (r.pos >= 999) return;
    if (!(r.grid > 0) && raceMode && early && !gridMap[r.num]) gridMap[r.num] = r.pos;
    const pv = prevPos[r.num];
    if (pv && pv !== r.pos) posFlash[r.num] = {dir: r.pos < pv ? 'up' : 'down', until: now + 3500};
    prevPos[r.num] = r.pos;
  });
}
function renderTiming(){
  const rows0 = buildRows();
  const rows = rows0.sort((a,b) => a.pos - b.pos);
  const raceMode = isRaceSession();
  trackGridAndMoves(rows, raceMode);
  const el = document.getElementById('timingList');
  const hasSegs = rows.some(r => (r.segs || []).some(a => a.length) || toList(r.sectors).some(x => x && toList(x.Segments).length));
  document.getElementById('secLabel').textContent = secMode === 'mini' ? (hasSegs ? 'Mini sectors' : 'Mini sectors · no segment feed yet') : 'Sector times';
  if (!rows.length){ el.innerHTML = '<div class="empty">Waiting for timing data…</div>'; return; }
  const rcMsgs = getRC();
  const fastest = Math.min(...rows.map(r => lapSecs(r.best)));
  morph(el, rows.map(r => {
    const nk = String(r.num), tla = String(r.tla);
    const isLeader = r.pos === 1;
    const gapTxt = isLeader ? 'LEADER' : fmtGap(r.gap, r.pos);
    const intTxt = isLeader ? '' : fmtGap(r.interval, r.pos);
    const bestCls = (isFinite(fastest) && lapSecs(r.best) === fastest) ? 'fast' : '';
    const pUrl = portraitUrl(tla), tLogo = teamLogoUrl(tla);
    const t = telemetry[nk];
    const drsOpen = t && typeof t.drs === 'number' && [10,12,14].includes(t.drs);
    const gp = r.grid > 0 ? r.grid : gridMap[r.num];
    const hasD = raceMode && gp > 0 && r.pos < 999;
    const dl = hasD ? gp - r.pos : 0;
    const pd = !hasD ? '<span class="pd even">&nbsp;</span>'
      : dl > 0 ? `<span class="pd up" title="Started P${gp}">▲${dl}</span>`
      : dl < 0 ? `<span class="pd down" title="Started P${gp}">▼${-dl}</span>`
      : `<span class="pd even" title="Started P${gp}">=</span>`;
    const pf = posFlash[r.num];
    const moveCls = pf && pf.until > Date.now() ? (pf.dir === 'up' ? 'pgain' : 'ploss') : '';
    return `<div class="trow ${r.pit ? 'pit' : ''} ${selectedDriver === nk ? 'selected' : ''} ${moveCls}" data-num="${esc(nk)}">
      <div class="trow-top">
        <span class="posc"><span class="pos">${r.pos === 999 ? '—' : r.pos}</span>${pd}</span>
        <span class="swatch" style="background:${esc(r.color)}"></span>
        <img class="avatar" src="${pUrl}" alt="" onerror="this.classList.add('hidden')">
        <span class="dname" style="color:${isLeader ? '#fff' : 'inherit'}">${esc(shortName(r.name, tla))}</span>
        ${tLogo ? `<img class="teamlogo" src="${tLogo}" alt="" onerror="this.style.display='none'">` : ''}
        <span class="drspill ${drsOpen ? 'open' : ''}">DRS</span>
        ${r.pit ? '<span class="pitbadge">PIT</span>' : ''}${r.ret ? '<span class="retbadge">OUT</span>' : ''}
        <div class="gapcol">
          <span class="gap ${isLeader ? 'leader' : ''}">${esc(gapTxt)}</span>
          ${intTxt && intTxt !== '—' ? `<span class="interval">Int ${esc(intTxt)}</span>` : ''}
        </div>
      </div>
      <div class="trow-mid">
        ${sectorStrip(r.sectors, r.segs)}
        ${tyreBadge(r.comp, r.age)}
      </div>
      <div class="trow-bottom"><span>Last <b>${esc(r.last)}</b></span><span>Best <b class="${bestCls}">${esc(r.best)}</b></span></div>
      ${expanded.has(nk) ? detailHtml(r, rcMsgs) : ''}
    </div>`;
  }).join(''));
}

const FLAGS = {
  GREEN:IMGS.green, CLEAR:IMGS.green,
  YELLOW:IMGS.yellow, 'DOUBLE YELLOW':IMGS.dyellow,
  RED:IMGS.red, BLUE:IMGS.blue,
  CHEQUERED:IMGS.chq, 'BLACK AND WHITE':IMGS.bw
};
/* Race-control categories: blue flags, penalties, other flags, everything else. No chip selected = show all. */
const rcFilter = new Set();
function rcCat(m){
  const txt = String(m.Message || m.message || '').toUpperCase();
  const flag = String(m.Flag || '').toUpperCase();
  if (flag === 'BLUE' || /BLUE FLAG/.test(txt)) return 'blue';
  if (/PENALTY|DRIVE[ -]?THROUGH|STOP[ -]?GO|REPRIMAND|DISQUALIF|WARNING FOR|EXCLUDED|UNSAFE RELEASE|TRACK LIMITS|DELETED/.test(txt)) return 'pen';
  if (flag || m.Category === 'Flag' || /FLAG|SAFETY CAR|VSC|VIRTUAL SAFETY|RED FLAG|YELLOW|CHEQUERED/.test(txt)) return 'flag';
  return 'other';
}
function renderRC(){
  const all = getRC();
  const counts = {flag:0, pen:0, blue:0, other:0};
  all.forEach(m => counts[rcCat(m)]++);
  document.querySelectorAll('#rcFilters button').forEach(b => {
    b.classList.toggle('on', rcFilter.has(b.dataset.f));
    b.querySelector('i').textContent = counts[b.dataset.f] ? counts[b.dataset.f] : '';
  });
  const msgs = rcFilter.size ? all.filter(m => rcFilter.has(rcCat(m))) : all;
  const el = document.getElementById('rcList');
  if (!msgs.length){ el.innerHTML = '<div class="empty">' + (all.length ? 'No messages in this filter.' : 'No messages yet.') + '</div>'; return; }
  morph(el, msgs.slice(-30).reverse().map(m=>{
    const t = m.Utc ? new Date(m.Utc).toLocaleTimeString() : (m.time || '');
    const flag = m.Flag ? FLAGS[String(m.Flag).toUpperCase()] : null;
    const chip = flag ? `<img class="flagchip" src="${flag}" alt="${esc(m.Flag)}" title="${esc(m.Flag)}">` : `<span class="flagchip dotchip ${rcCat(m)}"></span>`;
    return `<div class="rc-msg">${chip}<div><span class="t">${t}${m.Lap ? ' · L' + m.Lap : ''}${m.Category ? ' · ' + esc(m.Category) : ''}</span>${esc(m.Message || m.message)}</div></div>`;
  }).join(''));
}
document.querySelectorAll('#rcFilters button').forEach(b => b.onclick = () => {
  const f = b.dataset.f;
  if (rcFilter.has(f)) rcFilter.delete(f); else rcFilter.add(f);
  renderRC();
});

// kineticws TrackStatus codes -> [icon, label]
const KFLAG = {'1':[FLAGS.CLEAR,'Track Clear'],'2':[FLAGS.YELLOW,'Yellow Flag'],'4':['🚨','Safety Car'],'5':[FLAGS.RED,'Red Flag'],'6':['🐢','Virtual Safety Car'],'7':['🐢','VSC Ending']};
/* ---- background atmosphere ----
   red / yellow / SC / VSC / chequered stay until the next flag; green ("track clear") fades out after 5 s. */
const ATMO_MAP = {red:'s-red', yellow:'s-yellow', sc:'s-sc', vsc:'s-vsc', clear:'s-clear', chq:'s-chq'};
let atmoPrev = null, atmoTimer = 0;
function setAtmo(key){   // key: none | red | yellow | sc | vsc | clear | chq   (callable from the console for testing)
  document.querySelectorAll('#atmo i').forEach(el => el.classList.toggle('on', ATMO_MAP[key] === el.className.replace(' on','').trim()));
}
function atmoKey(){
  if (chequeredNow()) return 'chq';
  const tk = ks.track || {}, ts = state.TrackStatus || {};
  const code = tk.Status !== undefined ? String(tk.Status) : (ts.Status !== undefined ? String(ts.Status) : '');
  const byCode = {'1':'clear','2':'yellow','4':'sc','5':'red','6':'vsc','7':'vsc'};
  if (byCode[code]) return byCode[code];
  const m = String(tk.Message || ts.Message || '').toLowerCase();
  if (m.includes('virtual')) return 'vsc';
  if (m.includes('safety')) return 'sc';
  if (m.includes('red')) return 'red';
  if (m.includes('yellow')) return 'yellow';
  if (m.includes('clear') || m.includes('green')) return 'clear';
  return 'none';
}
function updateAtmosphere(){
  const k = atmoKey();
  if (k === 'none' && atmoPrev === null) return;   // no status received yet: wait for the first real one
  if (k === atmoPrev) return;                 // only react when the flag actually changes
  const first = atmoPrev === null;
  atmoPrev = k;
  clearTimeout(atmoTimer);
  if (k === 'clear'){
    if (first){ setAtmo('none'); return; }    // page opened while already green: no flash
    setAtmo('clear');
    atmoTimer = setTimeout(() => setAtmo('none'), 5000);
  } else setAtmo(k);
}
function renderStatusBar(){
  // weather: kineticws first, then pitwall's WeatherData, then f1pedia's snapshot
  let w = ks.WeatherData || {};
  if (w.AirTemp === undefined) w = state.WeatherData || {};
  if (w.AirTemp === undefined && radioSnap && radioSnap.weather){ const f = radioSnap.weather; w = {AirTemp:f.air_temperature, TrackTemp:f.track_temperature, Rainfall:f.rainfall>0?1:0}; }
  const rain = (w.Rainfall==='1' || w.Rainfall===1);
  document.getElementById('wxIcon').textContent = rain ? '🌧️' : '☀️';
  document.getElementById('wAir').textContent = (w.AirTemp ?? '—') + '°';
  document.getElementById('wTrack').textContent = (w.TrackTemp ?? '—') + '°';
  document.getElementById('wCond').textContent = rain ? 'Wet' : (w.AirTemp!==undefined ? 'Clear' : '—');
  document.getElementById('wHum').textContent = w.Humidity !== undefined ? w.Humidity + '%' : '';
  document.getElementById('wWind').textContent = w.WindSpeed !== undefined ? w.WindSpeed + 'm/s' : '';

  // session name
  const se = ks.sess || {};
  const info = se.info || (ks.SessionInfo && ks.SessionInfo.info) || ks.SessionInfo || {};
  const si = (info.Meeting || info.Name) ? info : (state.SessionInfo || {});
  document.getElementById('sessionName').textContent = [si.Meeting && si.Meeting.Name, si.Name].filter(Boolean).join(' — ') || '—';

  // flag line: kineticws /track status first, pitwall TrackStatus as fallback
  const tk = ks.track || {};
  const ts = state.TrackStatus || {};
  const msg = String(ts.Message || '').toLowerCase();
  let icon = FLAGS.GREEN, text = 'Live';
  if (finished() || state.SessionStatus === 'Finished' || msg.includes('chequered')) { icon = FLAGS.CHEQUERED; text = 'Chequered Flag'; }
  else if (tk.Status !== undefined && KFLAG[String(tk.Status)]) { icon = KFLAG[String(tk.Status)][0]; text = KFLAG[String(tk.Status)][1]; }
  else if (tk.Message) { text = tk.Message; }
  else {
    text = ts.Message || 'Live';
    if (msg.includes('virtual')) { icon = '🐢'; text = 'Virtual Safety Car'; }
    else if (msg.includes('safety')) { icon = '🚨'; text = 'Safety Car'; }
    else if (msg.includes('red')) { icon = FLAGS.RED; text = 'Red Flag'; }
    else if (msg.includes('yellow')) { icon = FLAGS.YELLOW; text = 'Yellow Flag'; }
    else if (msg.includes('clear') || msg.includes('green') || msg.includes('allclear')) { icon = FLAGS.GREEN; text = 'Track Clear'; }
  }
  const flagIcon = document.getElementById('flagIcon');
  if (icon.startsWith('data:')) {
    if (flagIcon.dataset.i !== icon){ flagIcon.dataset.i = icon; flagIcon.innerHTML = `<img class="flag-icon" src="${icon}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:/red/.test(this.src)?'🟥':/yellow/.test(this.src)?'🟨':/chequered/.test(this.src)?'🏁':'🟩'}))">`; }
    flagIcon.firstChild.alt = text;
  } else if (flagIcon.dataset.i !== icon){ flagIcon.dataset.i = icon; flagIcon.textContent = icon; }
  document.getElementById('statusText').textContent = text;
  document.getElementById('wClock').classList.toggle('danger', icon===FLAGS.RED || icon==='🚨' || icon===FLAGS.YELLOW);

  const all = getRC();
  const key = all.filter(m => !rcNoise(m));
  const latest = key[key.length - 1] || all[all.length - 1];
  document.getElementById('rcTicker').textContent = latest ? (latest.Message || latest.message || '—') : '—';
  updateAtmosphere();
}

/* ============================================================
   RENDER — radio, with custom play button (no native <audio controls>)
   ============================================================ */
function fmtTime(s){ if (!isFinite(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function renderRadio(){
  const el = document.getElementById('radioList');
  // never rebuild while any player has been touched (playing OR mid-load) — rebuilding
  // replaces the <audio> element and kills playback / loses scrub position.
  if (el.querySelector('audio[data-touched="1"]')) return;
  const radios = radioSnap && radioSnap.team_radio;
  if (!Array.isArray(radios) || !radios.length){ el.innerHTML = '<div class="empty">No transcripts yet.</div>'; return; }
  const drivers = new Map((radioSnap.drivers||[]).map(d=>[d.driver_number, d]));

  // keep the filter dropdown's options in sync with who's actually in the radio feed
  const filterEl = document.getElementById('radioFilter');
  const prevFilter = filterEl.value;
  const known = new Set([...drivers.values()].map(d=>d.name_acronym).filter(Boolean));
  const optionsHtml = '<option value="">Filter by drivers</option>' + [...known].sort().map(tla=>`<option value="${tla}">${tla}</option>`).join('');
  if (filterEl.dataset.built !== [...known].sort().join(',')){
    filterEl.innerHTML = optionsHtml;
    filterEl.dataset.built = [...known].sort().join(',');
    filterEl.value = prevFilter && known.has(prevFilter) ? prevFilter : '';
  }
  const activeFilter = filterEl.value;

  let items = radios.slice().reverse().slice(0,60);
  if (activeFilter) items = items.filter(r=>{
    const d = drivers.get(r.driver_number) || {};
    return (r.acronym || d.name_acronym) === activeFilter;
  });
  items = items.slice(0,25);
  if (!items.length){ el.innerHTML = '<div class="empty">No transcripts for this driver yet.</div>'; return; }
  morph(el, items.map((r,i)=>{
    const d = drivers.get(r.driver_number) || {};
    const color = d.team_colour ? '#'+String(d.team_colour).replace('#','') : 'var(--muted)';
    const t = r.date ? new Date(r.date).toLocaleTimeString() : '';
    const tla = r.acronym || d.name_acronym || '';
    const pUrl = portraitUrl(tla);
    const lines = (r.transcript||[]).map(seg =>
      `<div class="line"><b>${seg.speaker==='driver' ? (tla || 'DRV') : 'PIT'}</b>${seg.en || seg.es || ''}</div>`
    ).join('');
    const player = r.recording_url ? `<div class="player" data-idx="${i}">
        <button class="playbtn" data-src="${r.recording_url}"></button>
        <div class="ptrack"><div class="pfill"></div></div>
        <span class="ptime">0:00</span>
      </div>` : '';
    return `<div class="rcard" style="border-left-color:${color}">
      <div class="rmeta">${pUrl?`<img class="ravatar" src="${pUrl}" alt="" onerror="this.style.visibility='hidden'">`:''}<span class="rtla" style="color:${color}">${tla || r.driver_number}</span><span class="rtime">${t}</span></div>
      ${player}
      ${lines || '<div class="empty" style="padding:4px 0;">No transcript</div>'}
    </div>`;
  }).join(''));
}
// Event delegation so the custom player survives rebuilds without re-binding per element.

document.getElementById('radioList').addEventListener('click', (e)=>{
  const btn = e.target.closest('.playbtn');
  const track = e.target.closest('.ptrack');
  if (btn){
    const player = btn.closest('.player');
    let audio = player.querySelector('audio');
    if (!audio){
      audio = document.createElement('audio');

      player.appendChild(audio);

        const fill = player.querySelector('.pfill'), time = player.querySelector('.ptime');

        time.textContent = fmtTime(audio.duration - audio.currentTime || 0);
      });
      audio.addEventListener('play', ()=>{ audio.dataset.touched='1'; audio.dataset.playing='1'; btn.classList.remove('error'); btn.classList.add('playing'); });
      audio.addEventListener('pause', ()=>{ audio.dataset.playing='0'; btn.classList.remove('playing'); });
      audio.addEventListener('ended', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); player.querySelector('.pfill').style.width='0%'; });
      audio.addEventListener('error', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); btn.classList.add('error'); });
    }

    if (audio.paused){
      // mark touched *before* play() resolves so a radio-snapshot rebuild
      // mid-load can't rip the element out from under the pending play() call
      audio.dataset.touched = '1';
      const p = audio.play();
      if (p && typeof p.catch === 'function'){
        p.catch((err)=>{
          console.warn('Radio playback failed:', err);

          btn.classList.remove('playing');
          btn.classList.add('error');

      }

      audio.pause();
    }

    const audio = track.closest('.player').querySelector('audio');
    if (audio && audio.duration){
      const r = track.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    }
  }
});

/* ============================================================

const TM=(()=>{

  const fpDrv={}, scr={};
  let fpStatus=null, fpRc=[], lastMainPos=0, lastFpPos=0, active='main';

  /* ---- backup source: OpenF1 GPS of one clean past lap at this circuit (same coordinate system as the live feed) ---- */
  async function of1(key,y0){

  /* ---- Safety car / medical car: the position feed reports them as pseudo-cars #241 (SC) and #243 (medical). Drawn as a car icon instead of a number. ---- */
  const SPC={241:{k:'sc',lbl:'SC',bg:'#ff9f1a',body:'#14141a',roof:'#ffd23f'},243:{k:'med',lbl:'MED',bg:'#e5383b',body:'#ffffff',roof:'#e5383b'}};

/* in-place DOM patching: keeps <img>/<audio> nodes and scroll position alive between updates */
function morph(parent, html){ const t=document.createElement('template'); t.innerHTML=html; syncKids(parent,t.content); }
function keyOf(n){ return n.dataset ? n.dataset.num : undefined; }
function syncKids(a,b){
  const bk=[...b.childNodes], keyed=new Map();

      keyed.delete(k); if(m!==na) a.insertBefore(m,na||null); na=m;
    } else if(na && keyOf(na)!==undefined){ a.insertBefore(nb,na); i++; continue; }
    if(!na){ a.appendChild(nb); i++; continue; }
    syncNode(a,na,nb); i++;

function syncNode(a,na,nb){

  if(na.nodeType!==1){ if(na.nodeValue!==nb.nodeValue) na.nodeValue=nb.nodeValue; return; }
