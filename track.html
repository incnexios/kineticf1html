<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KINETIC / Track Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root{
  --bg:#0a0a0c; --panel:#141418; --line:#26262e;
  --text:#eceae4; --muted:#84838c; --amber:#ff9a1f; --cyan:#4fd8e8;
  --red:#ff4d4f; --green:#4ade80; --purple:#b98cff; --yellow:#eab308; --blue:#3b82f6;
  --sat-t:env(safe-area-inset-top,0px); --sat-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:#000; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px;}
#app{position:relative; width:100%; height:100%; overflow:hidden; background:var(--bg);}

/* track-status colour wash behind the map */
#atmo{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
#atmo i{position:absolute; inset:-14%; opacity:0; transition:opacity 1s ease; filter:blur(38px); will-change:opacity;
  background:
    radial-gradient(62% 52% at 10% 0%,   rgba(var(--c),.80), transparent 74%),
    radial-gradient(58% 48% at 100% 100%, rgba(var(--c),.68), transparent 74%),
    radial-gradient(75% 65% at 50% 45%,  rgba(var(--c),.34), transparent 80%);}
#atmo i.on{opacity:1;}
#atmo i.s-red{--c:255,59,48;}   #atmo i.s-yellow{--c:250,204,21;}  #atmo i.s-sc{--c:255,122,26;}
#atmo i.s-vsc{--c:255,194,51;}  #atmo i.s-clear{--c:52,211,102;}   #atmo i.s-chq{--c:226,232,240;}
@keyframes atmo-pulse{0%,100%{opacity:.7;}50%{opacity:1;}}
#atmo i.on.s-red{animation:atmo-pulse 1.6s ease-in-out infinite;}
#atmo i.on.s-yellow{animation:atmo-pulse 2.2s ease-in-out infinite;}
#atmo i.on.s-sc{animation:atmo-pulse 2.6s ease-in-out infinite;}
#atmo i.on.s-vsc{animation:atmo-pulse 3.2s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){ #atmo i.on{animation:none!important;} }
main{position:absolute; inset:0; z-index:1; padding-top:var(--sat-t);}
#view-track{position:relative; height:100%; overflow:hidden; background:rgba(10,10,12,.4);}

/* ---- map + its controls ---- */
#trackView{position:relative; height:100%;}
#trackCanvas{width:100%; height:100%; display:block; touch-action:none;}
.track-hint{position:absolute; top:12px; left:58px; max-width:40%; font-size:10px; color:var(--muted); background:rgba(20,20,24,.8); padding:5px 9px; border-radius:6px;}
.tvctl{position:absolute; top:10px; z-index:5; display:flex; flex-direction:column; gap:8px;}
.tvctl.l{left:10px;} .tvctl.r{right:10px;}
.tvb{width:38px; height:38px; border-radius:10px; background:rgba(20,20,24,.88); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; padding:0; cursor:pointer; touch-action:none;}
.tvb svg{width:17px; height:17px;}
.tvb.on{background:var(--cyan); color:#0a0a0c; border-color:var(--cyan); box-shadow:0 0 12px rgba(79,216,232,.5);}
.tvfocuslbl{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; display:none; padding:5px 11px; border-radius:999px; background:var(--cyan); color:#0a0a0c; font:700 10px 'JetBrains Mono',monospace; letter-spacing:.6px; white-space:nowrap; pointer-events:none;}
#tvCompass{border-radius:50%;} #tvCompass b{position:absolute; top:2px; font-size:8px; color:var(--muted);}
#tvNeedle{width:3px; height:14px; background:linear-gradient(#ef4444 50%,#52525b 50%); border-radius:2px;}
.tvhid{display:none!important;}
.tvdir{position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none; opacity:0; transition:opacity .25s; padding:4px 12px; border-radius:999px; background:rgba(14,14,18,.9); border:1px solid var(--line); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--cyan);}
.tvdir.on{opacity:1;}
#trackCanvas{position:absolute; left:0; top:0;}
.track-hint{top:auto; bottom:calc(var(--dock-h,150px) + 18px + var(--sat-b)); left:10px; max-width:calc(100% - 20px); background:rgba(14,14,18,.55); font-size:9px; pointer-events:none; transition:bottom .25s;}
 .tvb.sq{width:38px;}
.k3dbar{position:absolute; left:64px; right:64px; bottom:calc(var(--dock-h,150px) + 46px + var(--sat-b)); z-index:6; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;}
.k3dbar[hidden]{display:none;}
.k3dbar > *{pointer-events:auto;}
.kb{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:12px; background:rgba(14,14,18,.76); border:1px solid rgba(255,255,255,.1); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); font:600 10px 'Space Grotesk',sans-serif; letter-spacing:.8px; color:var(--muted);}
.kb[hidden]{display:none;}
.kb button{font:700 10px 'Space Grotesk',sans-serif; letter-spacing:.8px; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); cursor:pointer;}
.kb button.on{background:var(--cyan); color:#0a0a0c; border-color:var(--cyan);}
.kt{display:flex; align-items:center; gap:6px;} .kb input[type=range]{width:110px; accent-color:var(--cyan);}
#kbStreet input{width:200px;}
.kcap{font:700 10px 'Space Grotesk',sans-serif; letter-spacing:1.4px; text-transform:uppercase; color:#0a0a0c; background:var(--cyan); padding:4px 11px; border-radius:999px;} .kcap:empty{display:none;}
.kfocus{font:700 11px 'JetBrains Mono',monospace; color:var(--cyan); text-shadow:0 1px 6px #000;} .kfocus:empty{display:none;}
.tvb .md{position:absolute; right:4px; bottom:2px; font-size:8px; font-weight:700; line-height:1; color:inherit; opacity:.8;}

/* ---- floating session + weather cards ---- */
.dot{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block;}
.dot.live{background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.6s infinite;}
.dot.off{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.flagline{display:flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; white-space:nowrap; min-width:0;}
.flagline .flag-icon{width:18px; height:18px; object-fit:contain;}
.sl{font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:9px; line-height:1; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);}
.fcards{position:absolute; left:10px; right:10px; bottom:calc(10px + var(--sat-b)); z-index:6; display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; pointer-events:none; max-width:640px; transition:opacity .25s, transform .25s;}
.fcards.hide{opacity:0; transform:translateY(14px); visibility:hidden; transition:opacity .25s, transform .25s, visibility 0s .25s;}
.fcard{pointer-events:auto; min-width:0; padding:10px 12px; border-radius:14px; background:rgba(14,14,18,.74); border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%); box-shadow:0 8px 28px rgba(0,0,0,.45);}
#wxCard{flex:1 1 190px; order:1;}
#sessCard{flex:1.6 1 240px; order:2;}
.sc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.conn{display:flex; gap:5px; align-items:center;}
.sc-name{margin-top:3px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sc-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:6px;}
.sc-row > div{display:flex; flex-direction:column; gap:5px;}
.sc-row .r{align-items:flex-end;}
.sc-row b{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:24px; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap;}
.sc-row small{font-size:13px; font-weight:500; color:var(--muted);}
.sc-row .lapc .sl{color:var(--cyan);}
.clocktxt{color:var(--amber);} .clocktxt.danger{color:var(--red);} .clocktxt.stopped{color:var(--muted);}
.lapbar{display:block; height:3px; margin-top:8px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden;}
.lapbar u{display:block; height:100%; width:0; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transition:width .6s ease;}
.sc-rc{margin-top:7px; font-size:10px; line-height:1.35; letter-spacing:.3px; text-transform:uppercase; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere;}
.wx-top{display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;}
.wx-top .ic{font-size:18px; line-height:1;}
.wx-rain{display:none; margin-left:auto; padding:2px 7px; border-radius:999px; font-size:9px; font-weight:700; letter-spacing:.8px; color:#0a1220; background:#7cb8ff; animation:pulse 1.8s infinite;}
#wxCard.wet{border-color:rgba(124,184,255,.5); box-shadow:0 8px 28px rgba(0,0,0,.45), 0 0 18px rgba(80,150,255,.22);}
#wxCard.wet .wx-rain{display:inline-block;}
.wx-grid{display:grid; grid-template-columns:repeat(4,auto); justify-content:space-between; gap:6px 10px; margin-top:9px;}
.wx-grid > div{display:flex; flex-direction:column; gap:5px; min-width:0;}
.wx-grid b{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:3px;}
.wx-grid b em{font-style:normal; font-size:9px; font-weight:500; color:var(--muted);}
#wWindArr{display:inline-block; font-style:normal; font-size:11px; color:var(--cyan); transition:transform .6s;}
@media (max-width:420px){ .sc-row b{font-size:21px;} .fcard{padding:9px 10px;} }
@media (min-width:700px){ .fcards{left:14px; bottom:calc(14px + var(--sat-b));} .tvctl.l,.tvctl.r{top:14px;} .tvctl.l{left:14px;} .tvctl.r{right:14px;} #wxCard{order:2;} #sessCard{order:1;} }
@media (prefers-reduced-motion:reduce){ .wx-rain,.dot.live{animation:none;} }
.dtc{position:absolute; left:22px; bottom:calc(var(--dock-h,150px) + 120px + var(--sat-b)); z-index:7; pointer-events:none; display:none; font-family:'Space Grotesk',sans-serif; color:#fff;}
.dtc.on{display:block;}
.dtc .bar{position:absolute; left:0; top:0; bottom:0; width:6px; background:#e10600; transform:scaleY(0); transform-origin:bottom; transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.dtc .bd{margin-left:6px; padding:12px 26px 12px 16px; background:linear-gradient(90deg,rgba(10,10,14,.92),rgba(10,10,14,.55) 85%,transparent); clip-path:inset(0 100% 0 0); transition:clip-path .7s cubic-bezier(.2,.8,.2,1) .15s;}
.dtc.show .bar{transform:scaleY(1);} .dtc.show .bd{clip-path:inset(0 0 0 0);}
.dtc .tg{font:700 10px 'JetBrains Mono',monospace; letter-spacing:3px; color:#e10600; margin-bottom:4px;}
.dtc .ev{font-weight:700; font-size:clamp(22px,4.4vw,44px); line-height:1; letter-spacing:.5px; text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,.6);}
.dtc .ss{display:inline-block; margin-top:9px; padding:4px 12px; background:#fff; color:#0a0a0c; font-weight:700; font-size:clamp(11px,1.8vw,16px); letter-spacing:2px; text-transform:uppercase; transform:skewX(-14deg);}
.dtc .ss i{display:inline-block; font-style:normal; transform:skewX(14deg);}
.dtc .ci{margin-top:7px; font:500 11px 'JetBrains Mono',monospace; letter-spacing:1.5px; color:#b8b7c0; text-transform:uppercase;}
.dbug{position:absolute; left:60px; top:12px; z-index:6; pointer-events:none; display:none; align-items:stretch; font-family:'Space Grotesk',sans-serif; opacity:0; transition:opacity .6s;}
.dbug.on{display:flex;} .dbug.show{opacity:1;}
.dbug b{background:#e10600; width:5px;} .dbug span{background:rgba(10,10,14,.85); padding:6px 12px; font-weight:700; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:#fff; border:1px solid rgba(255,255,255,.08); border-left:0;}
.dbug em{font-style:normal; color:#e10600; margin-left:8px;}
/* ---- map overlay controls: flat surfaces, hairlines, no glow ---- */
.tvctl{gap:6px;}
.tvb{width:36px; height:36px; border-radius:6px; background:#0e0e11; border:1px solid #23232a; color:#9a99a3; transition:color .15s,border-color .15s,background .15s;}
.tvb:hover{color:var(--text); border-color:#3a3a44;}
.tvb svg{width:16px; height:16px; stroke-width:1.6;}
.tvb.on{background:#16161b; color:var(--text); border-color:#3a3a44; box-shadow:inset 2px 0 0 var(--cyan);}
.kb{gap:2px; padding:3px; border-radius:8px; background:#0e0e11; border:1px solid #23232a; -webkit-backdrop-filter:none; backdrop-filter:none; font:500 10px 'JetBrains Mono',monospace; letter-spacing:.6px;}
.kb button{border:0; border-radius:5px; background:transparent; color:#9a99a3; padding:6px 10px; font:600 10px 'JetBrains Mono',monospace; letter-spacing:1px;}
.kb button:hover{color:var(--text);}
.kb button.on{background:#1c1c22; color:var(--text); box-shadow:inset 0 -2px 0 var(--cyan);}
.kb input[type=range]{-webkit-appearance:none; appearance:none; height:2px; background:#2d2d36; border-radius:1px; outline:0;}
.kb input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--text); border:0;}
.kb input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%; background:var(--text); border:0;}
.kcap,.tvfocuslbl,.tvdir{border-radius:4px; background:#0e0e11; border:1px solid #23232a; color:var(--text); font:500 10px 'JetBrains Mono',monospace; letter-spacing:1.2px;}
.kfocus{color:var(--text); font-weight:500; letter-spacing:.6px;}
.kset{position:absolute; right:56px; top:10px; z-index:7; width:248px; padding:12px; border-radius:8px; background:#0e0e11; border:1px solid #23232a; display:flex; flex-direction:column; gap:12px; font:500 11px 'JetBrains Mono',monospace; color:var(--text);}
.kset[hidden]{display:none;}
.kset .kh{font-size:10px; font-weight:600; letter-spacing:1.6px; color:var(--muted); padding-bottom:8px; border-bottom:1px solid #1d1d23;}
.kset .kr{display:flex; flex-direction:column; gap:6px;} .kset .kr.two{flex-direction:row;}
.kset .kl{font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);}
.kset .seg{display:flex; border:1px solid #23232a; border-radius:6px; overflow:hidden;}
.kset .seg button{flex:1; padding:6px 0; border:0; border-right:1px solid #23232a; background:transparent; color:#9a99a3; font:500 10px 'JetBrains Mono',monospace; cursor:pointer;}
.kset .seg button:last-child{border-right:0;} .kset .seg button:hover{color:var(--text);}
.kset .seg button.on{background:#1c1c22; color:var(--text); box-shadow:inset 0 -2px 0 var(--cyan);}
.kset .ghost{flex:1; padding:6px 8px; border:1px solid #23232a; border-radius:6px; background:transparent; color:#9a99a3; font:500 10px 'JetBrains Mono',monospace; cursor:pointer;} .kset .ghost:hover{color:var(--text); border-color:#3a3a44;} .kset .ghost:last-of-type{flex:0 0 auto;}
.kset .sw{display:flex; justify-content:space-between; align-items:center; cursor:pointer; color:#c9c8cf;}
.kset .sw input{-webkit-appearance:none; appearance:none; width:28px; height:16px; margin:0; border-radius:8px; background:#26262e; position:relative; cursor:pointer; transition:background .15s;}
.kset .sw input::after{content:''; position:absolute; left:2px; top:2px; width:12px; height:12px; border-radius:50%; background:#9a99a3; transition:transform .15s,background .15s;}
.kset .sw input:checked{background:#1f3a40;} .kset .sw input:checked::after{transform:translateX(12px); background:var(--cyan);}
.kset p{margin:0; font-size:10px; line-height:1.4; color:var(--muted);} .kset p:empty{display:none;}
@media (min-width:700px){ .kset{right:60px; top:14px;} }
.kset input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:2px; background:#2d2d36; border-radius:1px; outline:0; margin:6px 0;}
.kset input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--text); border:0;}
.kset input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%; background:var(--text); border:0;}
.kset .kl b{color:var(--text); font-weight:500; margin-left:6px;}
.lvonly[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="atmo" aria-hidden="true"><i class="s-red"></i><i class="s-yellow"></i><i class="s-sc"></i><i class="s-vsc"></i><i class="s-clear"></i><i class="s-chq"></i></div>
<main>
  <div class="view on" id="view-track"><div id="trackView"><canvas id="trackCanvas"></canvas>
    <div class="tvctl l">
      <button class="tvb" id="tvCompass" title="Tap to turn the map N → E → S → W · drag to rotate freely"><b>N</b><div id="tvNeedle"></div></button>
      <button class="tvb" id="tvReset" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="tvb on" id="tvScene" title="Map layout"><b class="md">R</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></button>
      <button class="tvb on" id="tvInfo" title="Show / hide session &amp; weather cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg></button>
      <button class="tvb" id="tvThree" title="3D view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
      <button class="tvb" id="tvDemo" title="Demo: run the circuit, then pull out to the full-circuit view"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"/></svg></button>
    </div>
    <div class="tvfocuslbl" id="tvFocusLbl"></div>
    <div class="tvdir" id="tvDirLbl"></div>
    <div class="tvctl r">
      <button class="tvb" id="tvFocus" title="Focus: zoom in and follow the selected driver (follows the leader if none is selected)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="tvb" id="tvRecenter" title="Recenter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
      <button class="tvb" id="tvZin" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></button>
      <button class="tvb" id="tvZout" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg></button>
      <button class="tvb" id="tvSet" title="3D settings" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="kset" id="kSet" hidden>

const portraitCache = {}; // tla -> {img, ok}
function getPortrait(tla){
  if (!tla || !DRIVER_PORTRAITS[tla]) return null;
  let c = portraitCache[tla];
  if (!c){
    c = {img:new Image(), ok:false};
    c.img.crossOrigin = 'anonymous';
    c.img.onload = () => c.ok = true;
    c.img.onerror = () => c.ok = false;
    c.img.src = DRIVER_PORTRAITS[tla];
    portraitCache[tla] = c;
  }
  return c.ok ? c.img : null;
}
function portraitUrl(tla, size = 128){      // avatars are 22-36px: request a small crop instead of the 1000px original
  const u = tla && DRIVER_PORTRAITS[tla];
  return u ? (size ? u.replace('w_1000,h_1000', 'w_' + size + ',h_' + size) : u) : '';
}
function teamLogoUrl(tla){ return (tla && DRIVER_ASSETS[tla] && DRIVER_ASSETS[tla].teamLogo) || ''; }

function deepMerge(base, patch){
  if (typeof base !== 'object' || base === null || typeof patch !== 'object' || patch === null) return patch;
  const r = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for (const k in patch){ r[k] = (base[k] && typeof patch[k]==='object') ? deepMerge(base[k], patch[k]) : patch[k]; }
  return r;
}
function setDot(id, mode){ document.getElementById(id).className = 'dot ' + (mode==='live'?'live':mode==='off'?'off':''); }

function connectMain(){
  setDot('dotMain','connecting');
  try{ wsMain = new WebSocket(MAIN_WS); wsMain.binaryType = 'arraybuffer'; }catch(e){ scheduleMain(); return; }
  wsMain.onopen = () => { setDot('dotMain','live'); backoffMain = 2000; };
  wsMain.onmessage = (evt) => {
    let raw;
    try{
      raw = (evt.data instanceof ArrayBuffer) ? new TextDecoder().decode(pako.inflate(new Uint8Array(evt.data))) : evt.data;
      const obj = JSON.parse(raw);
      if (obj && obj.type==='bundle' && Array.isArray(obj.messages)) obj.messages.forEach(processMainMsg);
      else processMainMsg(obj);
    }catch(e){}
    dirty = true;
  };
  wsMain.onclose = () => { setDot('dotMain','off'); wsMain = null; scheduleMain(); };
  wsMain.onerror = () => {};
}
function scheduleMain(){ setTimeout(connectMain, backoffMain); backoffMain = Math.min(backoffMain*1.6, 20000); }

function processMainMsg(msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.R && typeof msg.R === 'object'){ applyMainInitial(msg.R); return; }
  if (Array.isArray(msg.M)){
    msg.M.forEach(entry => {
      if (entry && entry.H==='Streaming' && entry.M==='feed' && Array.isArray(entry.A) && entry.A.length>=2) applyMainFeed(entry.A[0], entry.A[1]);
    });
    return;
  }
  if (Array.isArray(msg) && msg.length>=2 && typeof msg[0]==='string') applyMainFeed(msg[0], msg[1]);
}
function applyMainInitial(initial){
  if (initial.TimingData) lastMainTiming = performance.now();
  for (const k in initial){
    if (k.slice(-2)==='.z'){ routeCompressed(k, initial[k]); continue; }
    state[k] = deepMerge(state[k] || {}, initial[k]);
  }
  if (initial.SessionInfo) trackSessionKey(initial.SessionInfo);
  if (state.ExtrapolatedClock) captureClock(state.ExtrapolatedClock);
}

    const dl = hasD ? gp - r.pos : 0;
    const pd = !hasD ? '<span class="pd even">&nbsp;</span>'
      : dl > 0 ? `<span class="pd up" title="Started P${gp}">▲${dl}</span>`
      : dl < 0 ? `<span class="pd down" title="Started P${gp}">▼${-dl}</span>`
      : `<span class="pd even" title="Started P${gp}">=</span>`;
    const pf = posFlash[r.num];
    const moveCls = pf && pf.until > Date.now() ? (pf.dir === 'up' ? 'pgain' : 'ploss') : '';
    return `<div class="trow ${r.pit ? 'pit' : ''} ${selectedDriver === nk ? 'selected' : ''} ${moveCls}" data-num="${esc(nk)}">
      <div class="trow-top">
        <span class="posc"><span class="pos">${r.pos === 999 ? '—' : r.pos}</span>${pd}</span>
        <span class="swatch" style="background:${esc(r.color)}"></span>
        <img class="avatar" src="${pUrl}" alt="" onerror="this.classList.add('hidden')">
        <span class="dname" style="color:${isLeader ? '#fff' : 'inherit'}">${esc(shortName(r.name, tla))}</span>
        ${tLogo ? `<img class="teamlogo" src="${tLogo}" alt="" onerror="this.style.display='none'">` : ''}
        <span class="drspill ${drsOpen ? 'open' : ''}">DRS</span>
        ${r.pit ? '<span class="pitbadge">PIT</span>' : ''}${r.ret ? '<span class="retbadge">OUT</span>' : ''}
        <div class="gapcol">
          <span class="gap ${isLeader ? 'leader' : ''}">${esc(gapTxt)}</span>
          ${intTxt && intTxt !== '—' ? `<span class="interval">Int ${esc(intTxt)}</span>` : ''}
        </div>
      </div>
      <div class="trow-mid">
        ${sectorStrip(r.sectors, r.segs)}
        ${tyreBadge(r.comp, r.age)}
      </div>
      <div class="trow-bottom"><span>Last <b>${esc(r.last)}</b></span><span>Best <b class="${bestCls}">${esc(r.best)}</b></span></div>
      ${expanded.has(nk) ? detailHtml(r, rcMsgs) : ''}
    </div>`;
  }).join(''));
}
document.getElementById('timingList').addEventListener('click', (e)=>{
  const card = e.target.closest('.trow');
  if (!card) return;
  const num = card.dataset.num;
  if (expanded.has(num)){ expanded.delete(num); if (selectedDriver === num) selectedDriver = null; }
  else { expanded.add(num); selectedDriver = num; }    // selection also highlights the car on the track map
  renderTiming();
});
function setSecBtns(){ document.querySelectorAll('#secToggle button').forEach(b => b.className = b.dataset.m === secMode ? 'on' : ''); }
document.querySelectorAll('#secToggle button').forEach(b => b.onclick = () => {
  secMode = b.dataset.m; try { localStorage.setItem('secMode', secMode); } catch(e){}
  setSecBtns(); renderTiming();
});
setSecBtns();

const FLAGS = {
  GREEN:IMGS.green, CLEAR:IMGS.green,
  YELLOW:IMGS.yellow, 'DOUBLE YELLOW':IMGS.dyellow,
  RED:IMGS.red, BLUE:IMGS.blue,
  CHEQUERED:IMGS.chq, 'BLACK AND WHITE':IMGS.bw
};
/* Race-control categories: blue flags, penalties, other flags, everything else. No chip selected = show all. */
const rcFilter = new Set();
function rcCat(m){
  const txt = String(m.Message || m.message || '').toUpperCase();
  const flag = String(m.Flag || '').toUpperCase();
  if (flag === 'BLUE' || /BLUE FLAG/.test(txt)) return 'blue';
  if (/PENALTY|DRIVE[ -]?THROUGH|STOP[ -]?GO|REPRIMAND|DISQUALIF|WARNING FOR|EXCLUDED|UNSAFE RELEASE|TRACK LIMITS|DELETED/.test(txt)) return 'pen';
  if (flag || m.Category === 'Flag' || /FLAG|SAFETY CAR|VSC|VIRTUAL SAFETY|RED FLAG|YELLOW|CHEQUERED/.test(txt)) return 'flag';
  return 'other';
}
function renderRC(){
  const all = getRC();
  const counts = {flag:0, pen:0, blue:0, other:0};
  all.forEach(m => counts[rcCat(m)]++);
  document.querySelectorAll('#rcFilters button').forEach(b => {
    b.classList.toggle('on', rcFilter.has(b.dataset.f));
    b.querySelector('i').textContent = counts[b.dataset.f] ? counts[b.dataset.f] : '';
  });
  const msgs = rcFilter.size ? all.filter(m => rcFilter.has(rcCat(m))) : all;
  const el = document.getElementById('rcList');
  if (!msgs.length){ el.innerHTML = '<div class="empty">' + (all.length ? 'No messages in this filter.' : 'No messages yet.') + '</div>'; return; }
  morph(el, msgs.slice(-30).reverse().map(m=>{
    const t = m.Utc ? new Date(m.Utc).toLocaleTimeString() : (m.time || '');
    const flag = m.Flag ? FLAGS[String(m.Flag).toUpperCase()] : null;
    const chip = flag ? `<img class="flagchip" src="${flag}" alt="${esc(m.Flag)}" title="${esc(m.Flag)}">` : `<span class="flagchip dotchip ${rcCat(m)}"></span>`;
    return `<div class="rc-msg">${chip}<div><span class="t">${t}${m.Lap ? ' · L' + m.Lap : ''}${m.Category ? ' · ' + esc(m.Category) : ''}</span>${esc(m.Message || m.message)}</div></div>`;
  }).join(''));
}
document.querySelectorAll('#rcFilters button').forEach(b => b.onclick = () => {
  const f = b.dataset.f;
  if (rcFilter.has(f)) rcFilter.delete(f); else rcFilter.add(f);
  renderRC();
});

// kineticws TrackStatus codes -> [icon, label]
const KFLAG = {'1':[FLAGS.CLEAR,'Track Clear'],'2':[FLAGS.YELLOW,'Yellow Flag'],'4':['🚨','Safety Car'],'5':[FLAGS.RED,'Red Flag'],'6':['🐢','Virtual Safety Car'],'7':['🐢','VSC Ending']};
/* ---- background atmosphere ----
   red / yellow / SC / VSC / chequered stay until the next flag; green ("track clear") fades out after 5 s. */
const ATMO_MAP = {red:'s-red', yellow:'s-yellow', sc:'s-sc', vsc:'s-vsc', clear:'s-clear', chq:'s-chq'};
let atmoPrev = null, atmoTimer = 0;
function setAtmo(key){   // key: none | red | yellow | sc | vsc | clear | chq   (callable from the console for testing)
  document.querySelectorAll('#atmo i').forEach(el => el.classList.toggle('on', ATMO_MAP[key] === el.className.replace(' on','').trim()));
}
function atmoKey(){
  if (chequeredNow()) return 'chq';
  const tk = ks.track || {}, ts = state.TrackStatus || {};
  const code = tk.Status !== undefined ? String(tk.Status) : (ts.Status !== undefined ? String(ts.Status) : '');
  const byCode = {'1':'clear','2':'yellow','4':'sc','5':'red','6':'vsc','7':'vsc'};
  if (byCode[code]) return byCode[code];
  const m = String(tk.Message || ts.Message || '').toLowerCase();
  if (m.includes('virtual')) return 'vsc';
  if (m.includes('safety')) return 'sc';
  if (m.includes('red')) return 'red';
  if (m.includes('yellow')) return 'yellow';
  if (m.includes('clear') || m.includes('green')) return 'clear';
  return 'none';
}
function updateAtmosphere(){
  const k = atmoKey();
  if (k === 'none' && atmoPrev === null) return;   // no status received yet: wait for the first real one
  if (k === atmoPrev) return;                 // only react when the flag actually changes
  const first = atmoPrev === null;
  atmoPrev = k;
  clearTimeout(atmoTimer);
  if (k === 'clear'){
    if (first){ setAtmo('none'); return; }    // page opened while already green: no flash
    setAtmo('clear');
    atmoTimer = setTimeout(() => setAtmo('none'), 5000);
  } else setAtmo(k);
}
function renderStatusBar(){
  // weather: kineticws first, then pitwall's WeatherData, then f1pedia's snapshot
  let w = ks.WeatherData || {};
  if (w.AirTemp === undefined) w = state.WeatherData || {};
  if (w.AirTemp === undefined && radioSnap && radioSnap.weather){ const f = radioSnap.weather; w = {AirTemp:f.air_temperature, TrackTemp:f.track_temperature, Rainfall:f.rainfall>0?1:0}; }
  let rain = w.Rainfall === true || Number(w.Rainfall) > 0;          // feed sends 0/1 (or '0'/'1')
  const rq = new URLSearchParams(location.search).get('rain');      // ?rain=1 / ?rain=0 previews the look
  if (rq === '1') rain = true; else if (rq === '0') rain = false;
  WXS.rain = rain; WXS.wind = Number(w.WindSpeed) || 0;
  document.getElementById('wxCard').classList.toggle('wet', rain);
  document.getElementById('wxIcon').textContent = rain ? '🌧️' : '☀️';
  document.getElementById('wAir').textContent = (w.AirTemp ?? '—') + '°';
  document.getElementById('wTrack').textContent = (w.TrackTemp ?? '—') + '°';
  document.getElementById('wCond').textContent = rain ? 'Raining' : (w.AirTemp !== undefined ? 'Dry' : '—');
  document.getElementById('wHum').textContent = w.Humidity !== undefined ? Math.round(w.Humidity) + '%' : '—';
  document.getElementById('wWind').textContent = w.WindSpeed !== undefined ? w.WindSpeed + ' m/s' : '—';
  const wa = document.getElementById('wWindArr'), wd = Number(w.WindDirection);
  if (w.WindDirection !== undefined && isFinite(wd)){ wa.style.display = ''; wa.style.transform = 'rotate(' + (wd + 90) + 'deg)'; }   // arrow points where the wind is blowing to
  else wa.style.display = 'none';

  // session name
  const se = ks.sess || {};
  const info = se.info || (ks.SessionInfo && ks.SessionInfo.info) || ks.SessionInfo || {};
  const si = (info.Meeting || info.Name) ? info : (state.SessionInfo || {});
  document.getElementById('sessionName').textContent = [si.Meeting && si.Meeting.Name, si.Name].filter(Boolean).join(' — ') || '—';

  // flag line: kineticws /track status first, pitwall TrackStatus as fallback
  const tk = ks.track || {};
  const ts = state.TrackStatus || {};
  const msg = String(ts.Message || '').toLowerCase();
  let icon = FLAGS.GREEN, text = 'Live';
  if (finished() || state.SessionStatus === 'Finished' || msg.includes('chequered')) { icon = FLAGS.CHEQUERED; text = 'Chequered Flag'; }
  else if (tk.Status !== undefined && KFLAG[String(tk.Status)]) { icon = KFLAG[String(tk.Status)][0]; text = KFLAG[String(tk.Status)][1]; }
  else if (tk.Message) { text = tk.Message; }
  else {
    text = ts.Message || 'Live';
    if (msg.includes('virtual')) { icon = '🐢'; text = 'Virtual Safety Car'; }
    else if (msg.includes('safety')) { icon = '🚨'; text = 'Safety Car'; }
    else if (msg.includes('red')) { icon = FLAGS.RED; text = 'Red Flag'; }
    else if (msg.includes('yellow')) { icon = FLAGS.YELLOW; text = 'Yellow Flag'; }
    else if (msg.includes('clear') || msg.includes('green') || msg.includes('allclear')) { icon = FLAGS.GREEN; text = 'Track Clear'; }
  }
  const flagIcon = document.getElementById('flagIcon');
  if (icon.startsWith('data:')) {
    if (flagIcon.dataset.i !== icon){ flagIcon.dataset.i = icon; flagIcon.innerHTML = `<img class="flag-icon" src="${icon}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:/red/.test(this.src)?'🟥':/yellow/.test(this.src)?'🟨':/chequered/.test(this.src)?'🏁':'🟩'}))">`; }
    flagIcon.firstChild.alt = text;
  } else if (flagIcon.dataset.i !== icon){ flagIcon.dataset.i = icon; flagIcon.textContent = icon; }
  document.getElementById('statusText').textContent = text;
  document.getElementById('wClock').classList.toggle('danger', icon===FLAGS.RED || icon==='🚨' || icon===FLAGS.YELLOW);

  const all = getRC();
  const key = all.filter(m => !rcNoise(m));
  const latest = key[key.length - 1] || all[all.length - 1];
  document.getElementById('rcTicker').textContent = latest ? (latest.Message || latest.message || '—') : '—';
  updateAtmosphere();
}

/* ============================================================
   RENDER — radio, with custom play button (no native <audio controls>)
   ============================================================ */
function fmtTime(s){ if (!isFinite(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function renderRadio(){
  const el = document.getElementById('radioList');
  // never rebuild while any player has been touched (playing OR mid-load) — rebuilding
  // replaces the <audio> element and kills playback / loses scrub position.
  if (el.querySelector('audio[data-touched="1"]')) return;
  const radios = radioSnap && radioSnap.team_radio;
  if (!Array.isArray(radios) || !radios.length){ el.innerHTML = '<div class="empty">No transcripts yet.</div>'; return; }
  const drivers = new Map((radioSnap.drivers||[]).map(d=>[d.driver_number, d]));

  // keep the filter dropdown's options in sync with who's actually in the radio feed
  const filterEl = document.getElementById('radioFilter');
  const prevFilter = filterEl.value;
  const known = new Set([...drivers.values()].map(d=>d.name_acronym).filter(Boolean));
  const optionsHtml = '<option value="">Filter by drivers</option>' + [...known].sort().map(tla=>`<option value="${tla}">${tla}</option>`).join('');
  if (filterEl.dataset.built !== [...known].sort().join(',')){
    filterEl.innerHTML = optionsHtml;
    filterEl.dataset.built = [...known].sort().join(',');
    filterEl.value = prevFilter && known.has(prevFilter) ? prevFilter : '';
  }
  const activeFilter = filterEl.value;

  let items = radios.slice().reverse().slice(0,60);
  if (activeFilter) items = items.filter(r=>{
    const d = drivers.get(r.driver_number) || {};
    return (r.acronym || d.name_acronym) === activeFilter;
  });
  items = items.slice(0,25);
  if (!items.length){ el.innerHTML = '<div class="empty">No transcripts for this driver yet.</div>'; return; }
  morph(el, items.map((r,i)=>{
    const d = drivers.get(r.driver_number) || {};
    const color = d.team_colour ? '#'+String(d.team_colour).replace('#','') : 'var(--muted)';
    const t = r.date ? new Date(r.date).toLocaleTimeString() : '';
    const tla = r.acronym || d.name_acronym || '';
    const pUrl = portraitUrl(tla);
    const lines = (r.transcript||[]).map(seg =>
      `<div class="line"><b>${seg.speaker==='driver' ? (tla || 'DRV') : 'PIT'}</b>${seg.en || seg.es || ''}</div>`
    ).join('');

// Event delegation so the custom player survives rebuilds without re-binding per element.
document.getElementById('radioFilter').addEventListener('change', ()=>{ radioDirty = true; });
document.getElementById('radioList').addEventListener('click', (e)=>{
  const btn = e.target.closest('.playbtn');
  const track = e.target.closest('.ptrack');
  if (btn){
    const player = btn.closest('.player');
    let audio = player.querySelector('audio');
    if (!audio){
      audio = document.createElement('audio');
      audio.src = btn.dataset.src; audio.preload = 'metadata';
      player.appendChild(audio);
      audio.addEventListener('timeupdate', ()=>{
        const fill = player.querySelector('.pfill'), time = player.querySelector('.ptime');
        if (audio.duration) fill.style.width = (audio.currentTime/audio.duration*100)+'%';
        time.textContent = fmtTime(audio.duration - audio.currentTime || 0);
      });
      audio.addEventListener('play', ()=>{ audio.dataset.touched='1'; audio.dataset.playing='1'; btn.classList.remove('error'); btn.classList.add('playing'); });
      audio.addEventListener('pause', ()=>{ audio.dataset.playing='0'; btn.classList.remove('playing'); });
      audio.addEventListener('ended', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); player.querySelector('.pfill').style.width='0%'; });
      audio.addEventListener('error', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); btn.classList.add('error'); });
    }
    // pause any other playing clip first
    document.querySelectorAll('#radioList audio').forEach(a=>{ if (a!==audio && !a.paused) a.pause(); });
    if (audio.paused){
      // mark touched *before* play() resolves so a radio-snapshot rebuild
      // mid-load can't rip the element out from under the pending play() call
      audio.dataset.touched = '1';
      const p = audio.play();
      if (p && typeof p.catch === 'function'){
        p.catch((err)=>{
          console.warn('Radio playback failed:', err);
          audio.dataset.touched = '0';
          btn.classList.remove('playing');
          btn.classList.add('error');
        });
      }
    } else {
      audio.pause();
    }
  } else if (track){
    const audio = track.closest('.player').querySelector('audio');
    if (audio && audio.duration){
      const r = track.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    }
  }
});

    <div class="flrow"><div class="fltime" id="flTime">${flFmt(performance.now() - INS.t0)}</div>${tg ? `<div class="fltg" style="border-bottom:2px solid ${esc(tg.r.color)}">${esc(tg.r.tla)} #${esc(tg.r.num)}<b>${esc(tg.r.best || '-')}</b></div>` : ''}</div><div class="flsecs">${secs}</div></div>`;
}
function renderInsights(){
  document.getElementById('flCtl').style.display = INS.tab === 'fly' ? 'flex' : 'none';
  document.querySelectorAll('#insTabs button').forEach(b => b.className = b.dataset.t === INS.tab ? 'on' : '');
  const h = INS.tab === 'speed' ? renderSpeedTrap() : INS.tab === 'fly' ? renderFlying() : renderStrategy();
  morph(document.getElementById('insBody'), h);
}
document.querySelectorAll('#insTabs button').forEach(b => b.onclick = () => { INS.tab = b.dataset.t; renderInsights(); });
document.getElementById('flSel').onchange = e => { INS.num = e.target.value || null; INS.auto = !e.target.value; renderInsights(); };
document.getElementById('flAuto').onchange = e => { INS.auto = e.target.checked; renderInsights(); };
document.getElementById('insBody').addEventListener('click', e => { const t = e.target.closest('[data-num]'); if (t && INS.tab !== 'fly'){ const n = t.dataset.num; selectedDriver = selectedDriver === n ? null : n; renderTiming(); } });
setInterval(() => { const el = document.getElementById('flTime'); if (el && INS.t0) el.textContent = flFmt(performance.now() - INS.t0); }, 100);

/* ============================================================
   OVERTAKE (OT) ESTIMATOR — no DRS channel exists in 2026.
   Uses only speed / throttle / brake / gear / RPM (2 Hz) + the gap to the car ahead.
   1. Baseline: per driver, per (aero-state, 10 km/h bin) acceleration on full-throttle samples while
      "alone" (gap ahead > 2 s). Tracks the lower envelope, i.e. the no-Boost/no-Overtake reference.
   2. dP ≈ m · (a − a_base) · v   (same speed bin + aero state, so the drag term cancels).
   3. Compare with the MGU-K envelope: standard 350 kW to 290 km/h then fading to 355; Overtake holds 350 kW to 337.
   4. Classify:  dP≥150 kW (or ≥60% of the envelope gain) with car ahead ≤1 s → OVERTAKE
                 dP≥150 kW short spike → BOOST · dP≥150 sustained → COMBINED · 50–100 kW sustained → STRAIGHT
   If the feed's own Manual-Override channel (47) is present it wins.
   ============================================================ */
const OTM = (() => {
  const MASS = 798, HOLD = 2000, H = {};
  const pStd = v => v <= 290 ? 350 : v < 355 ? 350 * (355 - v) / 65 : 0;
  const pOm  = v => v <= 337 ? 350 : v < 355 ? 350 * (355 - v) / 18 : 0;
  function feed(num, t, gapAhead){
    if (!t || typeof t.speed !== 'number') return {mode:'—', ot:false, dP:0};
    const h = H[num] || (H[num] = {obj:null, s:[], base:{}, dps:[], hold:null});
    const now = performance.now();
    if (h.obj !== t){                       // a new telemetry frame arrived
      h.obj = t;
      const s = h.s, prev = s[s.length - 1];
      const cur = {t:now, v:t.speed, thr:t.throttle || 0, brk:t.brake ? 1 : 0, gear:t.gear, aero:t.aero};
      s.push(cur); if (s.length > 14) s.shift();
      if (prev){
        const dt = (cur.t - prev.t) / 1000;
        const clean = dt > 0.2 && dt < 1.5 && cur.thr >= 98 && prev.thr >= 98 && !cur.brk && !prev.brk && cur.gear === prev.gear && cur.v > 120;
        if (clean){
          const a = ((cur.v - prev.v) / 3.6) / dt;                 // m/s²
          const key = (cur.aero ?? 'x') + ':' + Math.round(cur.v / 10);
          const b = h.base[key];
          const alone = !(gapAhead <= 2) && t.overtake !== 1;
          if (!b) { if (alone) h.base[key] = {a, n:1}; }
          else if (alone){ b.a = a < b.a ? 0.7 * b.a + 0.3 * a : 0.97 * b.a + 0.03 * a; b.n++; }
          const bb = h.base[key];
          const dP = bb && bb.n >= 3 ? MASS * (a - bb.a) * (cur.v / 3.6) / 1000 : 0;   // kW
          h.dps.push({t:now, dP, v:cur.v, a}); if (h.dps.length > 12) h.dps.shift();
        } else if (cur.brk || cur.thr < 90){ h.dps.length = 0; }
      }
    }
    const last3 = h.dps.slice(-3);
    const dP = last3.length ? last3.reduce((x, y) => x + y.dP, 0) / last3.length : 0;
    let dur = 0, j = h.dps.length - 1;
    while (j >= 0 && h.dps[j].dP > 50) j--;
    if (j < h.dps.length - 1) dur = (h.dps[h.dps.length - 1].t - h.dps[j + 1].t) / 1000 + 0.5;
    const v = t.speed, env = pOm(v) - pStd(v);
    const near = gapAhead <= 1;
    let mode = null;
    if (t.overtake === 1) mode = 'OVERTAKE';
    else if (dP >= 150 || (env > 40 && dP >= 0.6 * env && v > 295)){
      mode = near ? 'OVERTAKE' : (dur > 3 ? 'COMBINED' : 'BOOST');
    } else if (dP >= 50 && dur >= 2) mode = 'STRAIGHT';
    else if (t.aero === 1) mode = 'STRAIGHT';
    if (mode){ h.hold = {mode, until: now + HOLD}; }
    else if (h.hold && h.hold.until > now) mode = h.hold.mode;
    else h.hold = null;
    return {mode: mode || '—', ot: mode === 'OVERTAKE' || (mode === 'COMBINED' && near), dP};
  }
  return {feed};
})();


/* ---- map-only build: skip the heavy list renders, keep what the map + info cards depend on ---- */
renderRadio = renderInsights = renderRC = function(){};
renderTiming = function(){ trackGridAndMoves(buildRows(), isRaceSession()); };
let lastFullRender = 0;
function render(now){
  if (dirty && now - lastFullRender > 500){
    dirty = false; lastFullRender = now;
    renderStatusBar(); renderTiming(); renderLap();
  }
  renderClock();
  TM.draw(now);
  requestAnimationFrame(render);
}

document.getElementById('tvInfo').onclick = function(){
  const hidden = document.getElementById('fcards').classList.toggle('hide');
  this.classList.toggle('on', !hidden);
  document.getElementById('trackHint').style.bottom = hidden ? '12px' : '';
};
/* keep the map's status line clear of the floating cards */
new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', document.getElementById('fcards').offsetHeight + 'px')).observe(document.getElementById('fcards'));

TM.resize();
setTimeout(() => TM.resize(), 0);
connectMain();
connectRadio();
bootstrapK().then(connectK);
loop(pollTiming, 2000, 20000);
loop(pollMeta, 5000, 30000);
requestAnimationFrame(render);
